<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173d63"><title>アクワイア｜遊び方チュートリアル</title>
<style>
:root{--navy:#173d63;--blue:#286b9b;--gold:#d7a84b;--ink:#263746;--muted:#667783;--line:#dce4e9;--bg:#f3f6f8;--green:#367c62;--red:#b74f4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;line-height:1.75}header{background:linear-gradient(120deg,#122d4b,var(--blue));color:#fff;padding:24px max(18px,calc((100vw - 1050px)/2)) 28px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:11px;letter-spacing:.16em;opacity:.85}header a{color:white;text-decoration:none;border:1px solid #ffffff80;border-radius:24px;padding:6px 12px;font-size:12px}h1{font-size:clamp(26px,5vw,39px);margin:12px 0 3px;line-height:1.3}header p{margin:0;color:#e1eaf0;font-size:14px}main{max-width:1050px;margin:25px auto 55px;padding:0 16px;display:grid;grid-template-columns:245px minmax(0,1fr);gap:18px}nav,.panel{background:white;border:1px solid var(--line);border-radius:17px;box-shadow:0 8px 25px #16324a0d}nav{padding:14px;height:max-content;position:sticky;top:12px}nav h2{font-size:13px;color:var(--muted);margin:4px 8px 10px}.navlist{display:grid;gap:3px}.lesson{width:100%;display:flex;align-items:center;gap:9px;text-align:left;border:0;background:transparent;border-radius:10px;padding:9px;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}.lesson:hover{background:#f2f6f8}.lesson.active{background:#e9f1f7;color:var(--navy);font-weight:750}.num{width:25px;height:25px;border-radius:50%;background:#edf1f3;display:grid;place-items:center;font-size:11px;flex:none}.active .num{background:var(--blue);color:white}.panel{padding:clamp(18px,3vw,30px);min-width:0}.eyebrow{font-size:11px;letter-spacing:.1em;color:var(--blue);font-weight:800}.title{font-size:clamp(22px,4vw,30px);margin:4px 0 6px;line-height:1.4}.intro{color:var(--muted);margin:0 0 17px}.progress{height:6px;background:#e8edf0;border-radius:9px;overflow:hidden;margin-bottom:22px}.progress span{display:block;height:100%;background:var(--gold);transition:width .2s}.callout{background:#eef4f8;border-left:4px solid var(--blue);padding:13px 15px;border-radius:9px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}.mini{background:#f7f9fa;border:1px solid var(--line);border-radius:12px;padding:13px}.mini b{display:block;color:var(--blue);font-size:12px;margin-bottom:4px}.mini p{font-size:13px;margin:0;line-height:1.65}.diagram{background:#f6f8f9;border:1px solid var(--line);border-radius:13px;padding:15px;margin:16px 0}.tiles{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.tile{width:45px;height:58px;background:#fff;border:1px solid #b8c6cf;border-radius:7px;display:grid;place-items:center;font-weight:800;color:var(--navy);box-shadow:0 2px 4px #0000000b}.tile.new{border:2px solid var(--gold);background:#fff9e9}.arrow{font-size:19px;color:var(--gold);font-weight:800}.table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0}.table th,.table td{border-bottom:1px solid var(--line);padding:9px;text-align:left}.table th{background:#f4f7f9;color:#435563}.quiz{border:1px solid var(--line);border-radius:13px;padding:15px;margin:14px 0}.choice{display:block;width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin:8px 0;font:inherit;font-size:14px;cursor:pointer}.choice:hover{border-color:var(--blue)}.choice.good{border-color:var(--green);background:#edf7f1}.choice.bad{border-color:var(--red);background:#fff1ef}.feedback{min-height:26px;font-size:13px;color:var(--muted);margin-top:8px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.btn{border:0;border-radius:10px;padding:11px 17px;background:var(--blue);color:#fff;font-weight:750;cursor:pointer}.btn.secondary{background:#edf2f5;color:var(--navy)}.btn:disabled{opacity:.4;cursor:not-allowed}.small{font-size:12px;color:var(--muted)}footer{text-align:center;color:#84919a;font-size:11px;padding:18px}@media(max-width:720px){main{display:block;margin-top:14px}nav{position:static;margin-bottom:12px;overflow:auto}.navlist{display:flex;width:max-content}.lesson{width:auto;white-space:nowrap}.grid{grid-template-columns:1fr}.panel{padding:18px}.top{align-items:flex-start}}
</style></head><body>
<header><div class="top"><div class="brand">BOARD GAME PLAYGROUND</div><a href="/">ゲーム一覧へ戻る</a></div><h1>アクワイアの遊び方</h1></header>
<main><nav><h2>学習ステップ</h2><div class="navlist" id="navlist"></div></nav><section class="panel"><div class="eyebrow" id="eyebrow"></div><h2 class="title" id="title"></h2><p class="intro" id="intro"></p><div class="progress"><span id="progress"></span></div><div id="stage"></div><div class="actions"><button class="btn secondary" id="back">戻る</button><button class="btn" id="next">次へ</button></div></section></main><footer>アクワイア 基本ルール学習用 · 版によって異なる細部は説明書を優先してください</footer>
<script>
const lessons=[
{t:"アクワイアクイズ",i:"問題に答えて、ホテル経営と株のルールをマスターしよう！",q:true}
];
let current=0;
const nav=document.getElementById('navlist'),stage=document.getElementById('stage');
function render(){const l=lessons[current];document.getElementById('eyebrow').textContent='LESSON '+String(current+1).padStart(2,'0')+' / '+lessons.length;document.getElementById('title').textContent=l.t;document.getElementById('intro').textContent=l.i;document.getElementById('progress').style.width=((current+1)/lessons.length*100)+'%';document.getElementById('back').disabled=current===0;document.getElementById('next').textContent=current===lessons.length-1?'最初に戻る':'次へ';nav.innerHTML=lessons.map((x,i)=>'<button class="lesson '+(i===current?'active':'')+'" data-i="'+i+'"><span class="num">'+(i+1)+'</span><span>'+x.t+'</span></button>').join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));stage.innerHTML=l.q?quiz():(l.practice?practice():l.h);if(l.practice)drawPractice();}
function go(i){current=i;render();window.scrollTo({top:0,behavior:'smooth'});}
document.getElementById('back').onclick=()=>go(Math.max(0,current-1));document.getElementById('next').onclick=()=>go(current===lessons.length-1?0:current+1);
const questions=[{q:'自分の手番で基本的に行う順番は？',a:['株を買う→タイルを置く→補充','タイルを置く→合併処理・株購入→補充','補充→株を買う→タイルを置く'],c:1,e:'タイルを置き、設立や合併を処理してから株を買い、最後にタイルを補充します。'},{q:'通常、タイル11枚以上のホテルチェーンは？',a:['安全になり吸収されない','株を買えなくなる','ゲームから取り除かれる'],c:0,e:'11枚以上は安全なチェーンとなり、他のチェーンに吸収されません。'},{q:'ゲーム終了時に勝つのは？',a:['株を最も多く持つ人','ホテルを最も多く設立した人','最も多く現金を持つ人'],c:2,e:'最終ボーナスと株の売却を終えた後、現金が最も多い人が勝ちです。'}];

const scenarios=[
{title:'STEP 1｜ホテルチェーンを設立',story:'あなたが置いたタイルが、まだホテルに属していない隣接タイルにつながりました。どうする？',options:['新しいホテルチェーンを1つ選び、本部を置く','つながったタイルを盤面から取り除く','すぐにゲームを終了する'],answer:0,why:'正解！未所属のタイル群がつながると、新しいチェーンを設立します。設立者は通常、そのチェーンの株を1枚無料で受け取ります（在庫がある場合）。'},
{title:'STEP 2｜成長しそうな株を買う',story:'手番中、盤面には活動中のホテルチェーンがあります。基本ルールで、この手番に購入できる株の上限は？',options:['1枚まで','合計3枚まで','何枚でも買える'],answer:1,why:'正解！自分の手番では、通常合計3枚まで株を購入できます。1つのチェーンにまとめても、複数に分けてもOKです。'},
{title:'STEP 3｜2つのホテルが合併！',story:'タイルを置いた結果、Aホテル（8枚）とBホテル（5枚）がつながりました。どちらが存続する？',options:['小さいBホテル','大きいAホテル','手番プレイヤーが必ず決める'],answer:1,why:'正解！通常はタイル数が多いチェーンが存続し、小さいチェーンを吸収します。同じ大きさの場合は、合併を起こしたプレイヤーが選びます。'},
{title:'STEP 4｜吸収されたホテルの株主',story:'吸収されるBホテルの株を、あなたが最も多く持っています。合併時に何が起きる？',options:['株は無価値になり、何も受け取れない','多数株主ボーナスを受け取る','存続ホテルの株を自動で全部もらう'],answer:1,why:'正解！吸収されるチェーンの筆頭株主は多数株主ボーナスを受け取ります。2番目の株主にも少数株主ボーナスがあります。金額はホテルの大きさなどで決まります。'},
{title:'STEP 5｜吸収された株をどうする？',story:'ボーナスを受け取りました。手元に残ったBホテルの株をどう扱える？',options:['売却・存続ホテル株との交換・保有から選ぶ','必ずすべて売却する','必ずすべて交換する'],answer:0,why:'正解！吸収されたホテルの株は、売却・通常2枚を存続ホテル株1枚に交換・保有から選べます。交換は存続ホテル株の在庫が必要です。'},
{title:'STEP 6｜投資家として勝つ',story:'ゲーム終了。全チェーンの最終ボーナスと株の売却を済ませました。勝者は誰？',options:['ホテルを一番多く建てた人','株券を一番多く持つ人','現金を一番多く持つ人'],answer:2,why:'正解！最後に持っている現金が最も多いプレイヤーが勝者です。株の枚数やホテルの数そのものでは決まりません。'}
];
let practiceAt=0,practicePoints=0,practiceDone=false;
function practice(){practiceAt=0;practicePoints=0;practiceDone=false;return '<div class="callout"><b>アクワイア実践モード</b><br>あなたが投資家となり、6つの場面で判断します。選択するとルールと理由が表示されます。</div><div id="acqPractice"></div>';}
function drawPractice(){const p=scenarios[practiceAt],area=document.getElementById('acqPractice');if(!area)return;area.innerHTML='<div class="quiz"><div class="eyebrow">SCENARIO '+(practiceAt+1)+' / '+scenarios.length+'</div><h3>'+p.title+'</h3><p>'+p.story+'</p>'+p.options.map((v,i)=>'<button class="choice practice-choice" data-pick="'+i+'">'+v+'</button>').join('')+'<div class="feedback" id="acqFeedback"></div><button class="btn" id="acqNext" disabled>'+(practiceAt===scenarios.length-1?'結果を見る':'次の場面へ')+'</button></div>';}

function quiz(){return questions.map((q,i)=>'<div class="quiz"><b>Q'+(i+1)+'. '+q.q+'</b>'+q.a.map((a,j)=>'<button class="choice" data-q="'+i+'" data-a="'+j+'">'+a+'</button>').join('')+'<div class="feedback" id="fb'+i+'"></div></div>').join('')+'<p class="small">すべての問題に挑戦して、基本ルールをおさらいしましょう。</p>';}
stage.addEventListener('click',e=>{const pb=e.target.closest('.practice-choice');if(pb){if(practiceDone)return;practiceDone=true;const p=scenarios[practiceAt],v=+pb.dataset.pick;if(v===p.answer)practicePoints++;stage.querySelectorAll('.practice-choice').forEach((x,i)=>{x.disabled=true;if(i===p.answer)x.classList.add('good');else if(x===pb)x.classList.add('bad');});document.getElementById('acqFeedback').textContent=(v===p.answer?'正解！ ':'ここは覚えておこう。 ')+p.why;const n=document.getElementById('acqNext');n.disabled=false;n.onclick=()=>{if(practiceAt<scenarios.length-1){practiceAt++;practiceDone=false;drawPractice();}else{document.getElementById('acqPractice').innerHTML='<div class="callout"><h3>実践終了！</h3><p>6場面中 <b>'+practicePoints+'問正解</b> です。</p><p>'+(practicePoints===6?'素晴らしい！投資・合併の基本を理解できています。':'間違えた場面の解説を読み返して、もう一度挑戦してみましょう。')+'</p><button class="btn" id="acqAgain">もう一度プレイ</button></div>';document.getElementById('acqAgain').onclick=()=>{practiceAt=0;practicePoints=0;practiceDone=false;drawPractice();};}};return;}const b=e.target.closest('.choice');if(!b)return;const qi=+b.dataset.q,ai=+b.dataset.a,q=questions[qi],box=document.getElementById('fb'+qi);stage.querySelectorAll('[data-q="'+qi+'"]').forEach(x=>{x.disabled=true;if(+x.dataset.a===q.c)x.classList.add('good');else if(x===b)x.classList.add('bad');});box.textContent=(ai===q.c?'正解！ ':'惜しい！ ')+q.e;});
render();
</script></body></html>
