<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#76523b"><title>カルカソンヌ｜クイズ</title>
<style>
:root{--main:#76523b;--sub:#9a704e;--gold:#d5ad59;--ink:#302a25;--muted:#766e66;--line:#e5ddd4;--bg:#f7f4ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;line-height:1.75}header{background:linear-gradient(120deg,#503925,var(--sub));color:white;padding:24px max(18px,calc((100vw - 900px)/2)) 28px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:11px;letter-spacing:.16em;opacity:.85}header a{color:white;text-decoration:none;border:1px solid #ffffff80;border-radius:24px;padding:6px 12px;font-size:12px}h1{font-size:clamp(26px,5vw,39px);margin:12px 0 3px}header p{margin:0;color:#f1e6d9;font-size:14px}main{max-width:900px;margin:25px auto 55px;padding:0 16px}.panel{background:white;border:1px solid var(--line);border-radius:17px;box-shadow:0 8px 25px #3d2b1b0d;padding:clamp(18px,3vw,30px)}.eyebrow,.qcount{font-size:11px;letter-spacing:.1em;color:var(--sub);font-weight:800}.title{font-size:clamp(22px,4vw,30px);margin:4px 0 6px}.intro{color:var(--muted);margin:0 0 17px}.progress{height:7px;background:#eee8e1;border-radius:9px;overflow:hidden;margin-bottom:22px}.progress span{display:block;height:100%;background:var(--gold);transition:width .2s}.quiz{border:1px solid var(--line);border-radius:13px;padding:17px;margin:14px 0}.question{font-size:17px;font-weight:750;margin:5px 0 13px}.choice{display:block;width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:9px;padding:12px;margin:8px 0;font:inherit;font-size:14px;cursor:pointer}.choice:hover{border-color:var(--sub)}.choice.good{border-color:#367c62;background:#edf7f1}.choice.bad{border-color:#b74f4b;background:#fff1ef}.choice:disabled{cursor:default}.feedback{display:none;font-size:13px;line-height:1.8;padding:12px;border-radius:9px;margin-top:10px;background:#f3f0eb;color:#51473d}.feedback.show{display:block}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 17px;background:var(--sub);color:#fff;font-weight:750;cursor:pointer}.btn.secondary{background:#eee8e1;color:var(--main)}.btn:disabled{opacity:.4;cursor:not-allowed}.result{text-align:center;padding:24px 10px}.score{font-size:42px;font-weight:850;color:var(--main)}footer{text-align:center;color:#91877d;font-size:11px;padding:18px}@media(max-width:640px){main{margin-top:14px}.top{align-items:flex-start}.panel{padding:17px}.question{font-size:16px}}
</style></head><body>
<header><div class="top"><div class="brand">BOARD GAME PLAYGROUND</div><a href="/">ゲーム一覧へ戻る</a></div><h1>カルカソンヌ クイズ</h1><p>問題に答えて、タイル配置と得点のルールをマスターしよう！</p></header>
<main><section class="panel"><div class="eyebrow" id="eyebrow">QUESTION 01</div><h2 class="title" id="title">カルカソンヌの基本クイズ</h2><p class="intro" id="intro">全5問。回答すると正解とルールの解説が表示されます。</p><div class="progress"><span id="progress" style="width:0%"></span></div><div id="stage"></div><div class="actions"><button class="btn secondary" id="restart" type="button">最初から</button><button class="btn" id="next" type="button" disabled>次の問題へ</button></div></section></main><footer>カルカソンヌ 基本セットの基本ルールをもとにしたクイズです</footer>
<script>
const questions=[
{q:'タイルを配置するとき、隣り合う辺はどうなっていなければならない？',a:['地形の種類が一致している','色が同じなら地形は違ってもよい','辺同士が接していればよい'],c:0,e:'道・草原・都市など、接する辺の地形が一致するように配置します。タイルは既に置かれたタイルに隣接させます。'},
{q:'自分のミープルを配置できるタイミングは？',a:['手番の最初ならいつでも','タイルを置いた直後','得点計算が終わった後だけ'],c:1,e:'通常はタイルを配置した直後に、その置いたタイル上の地形へミープルを1個配置できます。配置しない選択もできます。'},
{q:'完成した都市の基本的な得点は？',a:['都市タイル1枚につき2点、紋章も1つにつき2点','都市タイル1枚につき1点','都市の大きさに関係なく一律5点'],c:0,e:'完成した都市は、都市を構成するタイル1枚につき2点。紋章があるタイルも、紋章1つにつき追加で2点です。'},
{q:'道が完成する条件として正しいものは？',a:['道の両端が交差点・都市・修道院などで終わる、または環状につながる','道がタイル2枚以上あれば完成','道の上にミープルが2個以上必要'],c:0,e:'道は両端が交差点や都市、修道院などで終わるか、環状につながると完成します。完成した道はタイル1枚につき1点です。'},
{q:'修道院の得点は、いつ・何点になる？',a:['周囲8マスがタイルで囲まれたとき合計9点','周囲4マスが埋まったとき合計5点','ゲーム終了時に必ず3点'],c:0,e:'修道院は中央のタイルと周囲8マスの合計9マスが埋まると完成し、合計9点を得ます。'}
];
let index=0,score=0,answered=false;
const stage=document.getElementById('stage'),next=document.getElementById('next');
function render(){answered=false;const q=questions[index];document.getElementById('eyebrow').textContent='QUESTION '+String(index+1).padStart(2,'0')+' / '+questions.length;document.getElementById('progress').style.width=(index/questions.length*100)+'%';stage.innerHTML='<div class="quiz"><div class="qcount">第'+(index+1)+'問</div><div class="question">'+q.q+'</div>'+q.a.map((v,i)=>'<button class="choice" data-answer="'+i+'">'+v+'</button>').join('')+'<div class="feedback" id="feedback"></div></div>';next.disabled=true;next.textContent=index===questions.length-1?'結果を見る':'次の問題へ';}
stage.addEventListener('click',e=>{const b=e.target.closest('[data-answer]');if(!b||answered)return;answered=true;const q=questions[index],v=Number(b.dataset.answer);if(v===q.c)score++;stage.querySelectorAll('[data-answer]').forEach((x,i)=>{x.disabled=true;if(i===q.c)x.classList.add('good');else if(x===b)x.classList.add('bad');});const fb=document.getElementById('feedback');fb.className='feedback show';fb.textContent=(v===q.c?'正解！ ':'惜しい！ ')+q.e;next.disabled=false;});
next.addEventListener('click',()=>{if(!answered)return;if(index<questions.length-1){index++;render();}else showResult();});
function showResult(){document.getElementById('eyebrow').textContent='QUIZ COMPLETE';document.getElementById('title').textContent='クイズ終了！';document.getElementById('intro').textContent='カルカソンヌの基本ルールを振り返りましょう。';document.getElementById('progress').style.width='100%';stage.innerHTML='<div class="result"><div class="score">'+score+' / '+questions.length+'問正解</div><p>'+(score===5?'素晴らしい！基本ルールをしっかり理解できています。':score>=3?'いい調子です！解説を読み返して、もう一度挑戦してみましょう。':'解説を確認して、もう一度チャレンジしてみましょう。')+'</p><button class="btn" id="again" type="button">もう一度挑戦</button></div>';next.disabled=true;document.getElementById('again').onclick=restart;}
function restart(){index=0;score=0;render();document.getElementById('title').textContent='カルカソンヌの基本クイズ';document.getElementById('intro').textContent='全5問。回答すると正解とルールの解説が表示されます。';}
document.getElementById('restart').addEventListener('click',restart);render();
</script></body></html>
