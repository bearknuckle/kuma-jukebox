<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#315f45"><title>カタン｜遊び方チュートリアル</title>
<style>
:root{--green:#315f45;--green2:#477d5b;--gold:#d5a94e;--ink:#27372e;--muted:#68776e;--line:#dce5dc;--bg:#f3f7f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;line-height:1.75}header{background:linear-gradient(120deg,#234633,var(--green2));color:white;padding:24px max(18px,calc((100vw - 1050px)/2) ) 28px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:11px;letter-spacing:.16em;opacity:.85}header a{color:white;text-decoration:none;border:1px solid #ffffff80;border-radius:24px;padding:6px 12px;font-size:12px}h1{font-size:clamp(26px,5vw,39px);margin:12px 0 3px;line-height:1.3}header p{margin:0;color:#e5f0e7;font-size:14px}main{max-width:1050px;margin:25px auto 55px;padding:0 16px;display:grid;grid-template-columns:245px minmax(0,1fr);gap:18px}nav,.panel{background:white;border:1px solid var(--line);border-radius:17px;box-shadow:0 8px 25px #163a200d}nav{padding:14px;height:max-content;position:sticky;top:12px}nav h2{font-size:13px;color:var(--muted);margin:4px 8px 10px}.navlist{display:grid;gap:3px}.lesson{width:100%;display:flex;align-items:center;gap:9px;text-align:left;border:0;background:transparent;border-radius:10px;padding:9px;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}.lesson:hover{background:#f2f6f2}.lesson.active{background:#eaf2eb;color:var(--green);font-weight:750}.num{width:25px;height:25px;border-radius:50%;background:#edf1ed;display:grid;place-items:center;font-size:11px;flex:none}.active .num{background:var(--green2);color:white}.panel{padding:clamp(18px,3vw,30px);min-width:0}.eyebrow{font-size:11px;letter-spacing:.1em;color:var(--green2);font-weight:800}.title{font-size:clamp(22px,4vw,30px);margin:4px 0 6px;line-height:1.4}.intro{color:var(--muted);margin:0 0 17px}.progress{height:6px;background:#e8eee8;border-radius:9px;overflow:hidden;margin-bottom:22px}.progress span{display:block;height:100%;background:var(--gold);transition:width .2s}.callout{background:#eef5ef;border-left:4px solid var(--green2);padding:13px 15px;border-radius:9px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}.mini{background:#f7f9f7;border:1px solid var(--line);border-radius:12px;padding:13px}.mini b{display:block;color:var(--green);font-size:12px;margin-bottom:4px}.mini p{font-size:13px;margin:0;line-height:1.65}.diagram{background:#f6f8f6;border:1px solid var(--line);border-radius:13px;padding:15px;margin:16px 0}.resources{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.res{padding:8px 12px;border-radius:9px;background:white;border:1px solid var(--line);font-size:13px;font-weight:700}.res small{display:block;color:var(--muted);font-weight:400}.table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0}.table th,.table td{border-bottom:1px solid var(--line);padding:9px;text-align:left}.table th{background:#f4f7f4;color:#435548}.quiz{border:1px solid var(--line);border-radius:13px;padding:15px;margin:14px 0}.choice{display:block;width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin:8px 0;font:inherit;font-size:14px;cursor:pointer}.choice:hover{border-color:var(--green2)}.choice.good{border-color:#367c62;background:#edf7f1}.choice.bad{border-color:#b74f4b;background:#fff1ef}.feedback{min-height:26px;font-size:13px;color:var(--muted);margin-top:8px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.btn{border:0;border-radius:10px;padding:11px 17px;background:var(--green2);color:#fff;font-weight:750;cursor:pointer}.btn.secondary{background:#edf2ed;color:var(--green)}.btn:disabled{opacity:.4;cursor:not-allowed}.small{font-size:12px;color:var(--muted)}footer{text-align:center;color:#849188;font-size:11px;padding:18px}@media(max-width:720px){main{display:block;margin-top:14px}nav{position:static;margin-bottom:12px;overflow:auto}.navlist{display:flex;width:max-content}.lesson{width:auto;white-space:nowrap}.grid{grid-template-columns:1fr}.panel{padding:18px}.top{align-items:flex-start}}
</style></head><body>
<header><div class="top"><div class="brand">BOARD GAME PLAYGROUND</div><a href="/">ゲーム一覧へ戻る</a></div><h1>カタンの遊び方</h1><p>資源を集め、道を伸ばし、島を開拓して10点を目指そう！</p></header>
<main><nav><h2>学習ステップ</h2><div class="navlist" id="navlist"></div></nav><section class="panel"><div class="eyebrow" id="eyebrow"></div><h2 class="title" id="title"></h2><p class="intro" id="intro"></p><div class="progress"><span id="progress"></span></div><div id="stage"></div><div class="actions"><button class="btn secondary" id="back">戻る</button><button class="btn" id="next">次へ</button></div></section></main><footer>カタン 基本セット（3〜4人用）学習用 · 拡張セットのルールは含みません</footer>
<script>
const lessons=[
{t:"カタンってどんなゲーム？",i:"カタン島を開拓し、最初に10勝利ポイントを集めた人が勝ちです。",h:`<div class="callout"><b>ゲームの目的</b><br>資源を集めて街道・開拓地・都市を建設し、発展カードも活用して勝利点10点を目指します。</div><div class="grid"><div class="mini"><b>資源を集める</b><p>サイコロの出目に応じて、土地から資源を得る。</p></div><div class="mini"><b>交易する</b><p>他のプレイヤーや銀行と資源を交換する。</p></div><div class="mini"><b>建設する</b><p>道・開拓地・都市を増やして得点する。</p></div></div><p>毎回変わる島の地形と、他のプレイヤーとの場所取りが面白さです。</p>`},
{t:"5種類の資源",i:"土地の種類によって、産出される資源が決まっています。",h:`<div class="resources"><div class="res">🌲 木材<small>森林</small></div><div class="res">🧱 レンガ<small>丘陵</small></div><div class="res">🐑 羊毛<small>牧草地</small></div><div class="res">🌾 小麦<small>畑</small></div><div class="res">⛰️ 鉱石<small>山地</small></div></div><p>砂漠からは資源が出ません。各土地には数字チップが置かれ、サイコロの合計がその数字と一致すると資源が産出されます。</p><div class="callout">開拓地は隣接する土地から資源1枚、都市は資源2枚を受け取ります。盗賊がいる土地からは資源が出ません。</div>`},
{t:"ゲームの準備と初期配置",i:"最初に開拓地2つと街道2本を、順番に配置します。",h:`<ol><li>各プレイヤーは色を選び、開拓地5個・都市4個・街道15本を受け取ります。</li><li>最初のプレイヤーから時計回りに、開拓地1つと街道1本を置きます。</li><li>最後のプレイヤーから逆順に、2つ目の開拓地と街道を置きます。</li><li>2つ目の開拓地に隣接する土地から、初期資源を受け取ります。</li></ol><div class="callout"><b>間隔ルール</b><br>開拓地は、すでに開拓地や都市がある交差点の隣には置けません。間に少なくとも1つ交差点を空けます。2本目の街道は2つ目の開拓地につなげます。</div><p class="small">初期配置は「行き」と「帰り」の順番が逆になる蛇腹式です。後から置く人ほど、2つ目の場所を先に選べます。</p>`},
{t:"自分の手番の流れ",i:"サイコロを振り、交易し、建設するのが基本です。",h:`<div class="grid"><div class="mini"><b>① サイコロ</b><p>2個振り、出目に合う土地から全員が資源を受け取る。</p></div><div class="mini"><b>② 交易</b><p>他のプレイヤーや銀行と資源を交換する。</p></div><div class="mini"><b>③ 建設</b><p>資源を支払って街道・開拓地・都市・発展カードを購入。</p></div></div><p>交易と建設は、手番中に行ったり来たりしてかまいません。発展カードは手番中いつでも使えますが、原則として1手番に1枚です。</p>`},
{t:"交易のしかた",i:"足りない資源は、他のプレイヤーや銀行と交換できます。",h:`<ul><li><b>プレイヤーとの交易：</b>自分の資源を提示し、他のプレイヤーと条件を交渉します。相手が応じれば交換成立。</li><li><b>銀行との交易：</b>同じ資源4枚を別の資源1枚と交換できます。</li><li><b>港：</b>港に開拓地・都市があれば、指定された有利な交換比率を使えます。一般港は3:1、専門港は指定資源2:1です。</li></ul><div class="callout">銀行との交換は自分の手番のみ。他のプレイヤーとの交換も基本的に自分の手番に行います。資源を持っていない相手から、資源を借りることはできません。</div>`},
{t:"建設コストと勝利点",i:"資源の組み合わせによって、建設できるものが決まります。",h:`<table class="table"><tr><th>建設</th><th>必要な資源</th><th>勝利点</th></tr><tr><td>街道</td><td>木材1・レンガ1</td><td>0点</td></tr><tr><td>開拓地</td><td>木材1・レンガ1・羊毛1・小麦1</td><td>1点</td></tr><tr><td>都市</td><td>小麦2・鉱石3</td><td>2点</td></tr><tr><td>発展カード</td><td>羊毛1・小麦1・鉱石1</td><td>カードによる</td></tr></table><ul><li>街道は自分の街道や開拓地・都市につながるように置きます。</li><li>開拓地は自分の街道につながる空き交差点に置き、間隔ルールを守ります。</li><li>都市は自分の開拓地をアップグレードします。都市にした開拓地は手元に戻ります。</li></ul>`},
{t:"7が出た！盗賊のルール",i:"7が出ると資源の産出はなく、盗賊が動きます。",h:`<ol><li>資源カードを8枚以上持つプレイヤーは、手札の半分（端数切り捨て）を捨てます。</li><li>サイコロを振ったプレイヤーは盗賊を別の土地へ移動させます。</li><li>移動先に開拓地・都市を持つ相手がいれば、そのうち1人を選び、手札から資源カードをランダムに1枚奪います。</li></ol><div class="callout">盗賊がいる土地は、盗賊が移動するまで資源を産出しません。7以外にも、騎士カードを使うと盗賊を移動できます。</div>`},
{t:"発展カードと特別ボーナス",i:"発展カードには騎士・進歩・勝利点のカードがあります。",h:`<div class="grid"><div class="mini"><b>騎士</b><p>盗賊を移動。使用した騎士の数で最大騎士力を競う。</p></div><div class="mini"><b>進歩</b><p>街道建設・発見・独占など、カードの効果を使う。</p></div><div class="mini"><b>勝利点</b><p>隠して持ち、勝利宣言時に公開できる。</p></div></div><p><b>最長交易路：</b>最初に連続した街道5本以上を作ると獲得。より長い街道を作った人に移ります。2点。</p><p><b>最大騎士力：</b>使用済み騎士カードが最初に3枚以上になった人が獲得。より多くの騎士を使った人に移ります。2点。</p><div class="callout">買った手番に発展カードを使うことはできません（勝利点カードを公開する場合などの例外を除く）。</div>`},
{t:"ゲーム終了と勝利",i:"自分の手番中に勝利ポイントが10点以上になれば勝利です。",h:`<ul><li>開拓地：1点</li><li>都市：2点</li><li>最長交易路：2点</li><li>最大騎士力：2点</li><li>勝利点の発展カード：1点</li></ul><div class="callout"><b>大切なポイント</b><br>10点に達したことを確認して勝利を宣言できるのは、自分の手番中です。勝利点カードは通常、他のプレイヤーに見せずに持っておき、勝利宣言のときに公開します。</div><p>開拓地を増やすだけでなく、都市へのアップグレードや特別カードも組み合わせて10点を目指しましょう。</p>`},
{t:"理解度チェック",i:"基本ルールを覚えたか、3問で確認しましょう。",q:true}
];
let current=0;const nav=document.getElementById('navlist'),stage=document.getElementById('stage');
function render(){const l=lessons[current];document.getElementById('eyebrow').textContent='LESSON '+String(current+1).padStart(2,'0')+' / '+lessons.length;document.getElementById('title').textContent=l.t;document.getElementById('intro').textContent=l.i;document.getElementById('progress').style.width=((current+1)/lessons.length*100)+'%';document.getElementById('back').disabled=current===0;document.getElementById('next').textContent=current===lessons.length-1?'最初に戻る':'次へ';nav.innerHTML=lessons.map((x,i)=>'<button class="lesson '+(i===current?'active':'')+'" data-i="'+i+'"><span class="num">'+(i+1)+'</span><span>'+x.t+'</span></button>').join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));stage.innerHTML=l.q?quiz():l.h;}
function go(i){current=i;render();window.scrollTo({top:0,behavior:'smooth'});}
document.getElementById('back').onclick=()=>go(Math.max(0,current-1));document.getElementById('next').onclick=()=>go(current===lessons.length-1?0:current+1);
const questions=[{q:'サイコロで7が出たとき、資源カードを何枚以上持っていると半分捨てる？',a:['5枚以上','7枚以上','8枚以上'],c:2,e:'8枚以上なら、手札の半分（端数切り捨て）を捨てます。'},{q:'開拓地を建てるために必要な資源は？',a:['木材・レンガ・羊毛・小麦を各1枚','小麦2枚・鉱石3枚','木材2枚・レンガ2枚'],c:0,e:'開拓地は木材1、レンガ1、羊毛1、小麦1です。'},{q:'基本セットで勝利するために必要な点数は？',a:['8点','10点','12点'],c:1,e:'自分の手番中に10点以上になれば勝利です。'}];
function quiz(){return questions.map((q,i)=>'<div class="quiz"><b>Q'+(i+1)+'. '+q.q+'</b>'+q.a.map((a,j)=>'<button class="choice" data-q="'+i+'" data-a="'+j+'">'+a+'</button>').join('')+'<div class="feedback" id="fb'+i+'"></div></div>').join('')+'<p class="small">すべての問題に挑戦して、基本ルールをおさらいしましょう。</p>';}
stage.addEventListener('click',e=>{const b=e.target.closest('.choice');if(!b)return;const qi=+b.dataset.q,ai=+b.dataset.a,q=questions[qi],box=document.getElementById('fb'+qi);stage.querySelectorAll('[data-q="'+qi+'"]').forEach(x=>{x.disabled=true;if(+x.dataset.a===q.c)x.classList.add('good');else if(x===b)x.classList.add('bad');});box.textContent=(ai===q.c?'正解！ ':'惜しい！ ')+q.e;});
render();
</script></body></html>
