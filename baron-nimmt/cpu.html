<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f8c"><title>ニムト男爵｜CPU対戦</title>
<style>
:root{--teal:#087f8c;--deep:#075b67;--ink:#23343a;--muted:#65777d;--line:#d8e2e2;--cream:#fff8e9;--red:#c85d51;--green:#398c69;--blue:#4c83b8;--yellow:#d9a52d;--shadow:0 8px 24px #173c4614}
*{box-sizing:border-box}body{margin:0;background:#f3f7f6;color:var(--ink);font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif}header{background:linear-gradient(120deg,var(--deep),var(--teal));color:white;padding:18px max(16px,calc((100vw - 1050px)/2))}.brand{font-size:12px;letter-spacing:.12em;opacity:.85}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.head h1{font-size:clamp(22px,4vw,30px);margin:5px 0}.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.nav a{color:white;text-decoration:none;border:1px solid #ffffff80;border-radius:30px;padding:8px 12px;font-size:12px;white-space:nowrap}main{max-width:1050px;margin:20px auto;padding:0 14px 50px}.panel{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:clamp(15px,3vw,24px);margin-bottom:15px}.setup{display:flex;align-items:end;gap:12px;flex-wrap:wrap}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:white}.btn{border:0;border-radius:11px;padding:11px 16px;background:var(--teal);color:white;font-weight:750;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.alt{background:#eaf1f1;color:var(--deep)}.status{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.6}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.lane{background:#f7faf9;border:1px solid var(--line);border-radius:13px;padding:8px 5px;min-width:0}.lane.target{border:2px solid var(--teal);background:#eaf6f4;cursor:pointer;box-shadow:0 0 0 2px #087f8c22}.lane.chosen{border:3px solid #d49a18;background:#fff0bf;box-shadow:0 0 0 3px #d49a1833,0 4px 12px #8a641b25}.lane.target:after{content:'ここに置く';display:block;text-align:center;color:var(--deep);font-size:11px;font-weight:800;margin-top:6px}.lane h3{font-size:12px;color:var(--muted);margin:2px 0 8px;text-align:center}.cards{display:flex;flex-direction:column;align-items:center;gap:5px;min-height:68px}.card{width:49px;min-height:67px;border:1px solid #d5c6a4;border-radius:8px;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#493b2b;box-shadow:0 2px 4px #00000010}.card b{font-size:18px}.bulls{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:40px;margin-top:4px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block}.blue{background:var(--blue)}.red{background:var(--red)}.green{background:var(--green)}.yellow{background:var(--yellow)}.black{background:#303b42}.white{background:white;border:1px solid #aeb9bd}.hand{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 14px}.handcard{flex:0 0 65px;width:65px;min-height:94px;border:2px solid #d5c6a4;border-radius:10px;background:var(--cream);color:#493b2b;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}.handcard b{font-size:24px}.handcard .bulls{max-width:48px}.handcard.selected{outline:3px solid #65aaa0;border-color:var(--teal);transform:translateY(-4px)}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}.player{background:#f7faf9;border:1px solid var(--line);border-radius:11px;padding:10px}.player.me{border-color:var(--teal);background:#eef8f6}.player strong{font-size:13px}.player p{margin:5px 0 0;color:var(--muted);font-size:12px}.result{background:#eef8f6;border-radius:12px;padding:12px;line-height:1.65;font-size:13px;margin-top:10px}.small{font-size:11px;color:var(--muted);line-height:1.6}.tag{display:inline-block;background:#eaf1f1;border-radius:20px;padding:4px 8px;font-size:11px;margin-left:5px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none!important}
@media(max-width:600px){.head{flex-wrap:wrap}.nav{width:100%;justify-content:flex-start}.board{gap:4px}.lane{padding:6px 2px}.card{width:42px;min-height:60px}.card b{font-size:16px}.lane h3{font-size:10px}.handcard{flex-basis:59px;width:59px}.head{align-items:flex-start}}
 .version{display:inline-block;margin-left:8px;padding:2px 7px;border:1px solid #ffffff70;border-radius:20px;font-size:10px;letter-spacing:.04em;opacity:.9;vertical-align:middle}</style>
<style>
/* Visual consistency: clearer hierarchy, comfortable reading, and calmer spacing */
body{line-height:1.65;letter-spacing:.01em}h1,h2,h3{line-height:1.35;letter-spacing:0}.small,.note,.lead{line-height:1.8}.panel,.content,.gamebox{line-height:1.75}.btn,.action{letter-spacing:.01em}.btn:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid #e7ae45;outline-offset:3px}
@media(max-width:640px){header p{line-height:1.8}.content p,.intro{line-height:1.85}.btn{min-height:44px}.actions{gap:10px}}
</style>
</head><body>
<header><div class="brand">BARON NIMMT · CPU MATCH <span class="version">v0.2.0</span></div><div class="head"><h1>CPUと対戦</h1><div class="nav"><a href="/baron-nimmt/online">オンライン対戦</a><a href="/baron-nimmt">トップへ戻る</a></div></div></header>
<main>
<section class="panel" id="setupPanel"><div class="setup"><div class="field"><label for="count">プレイ人数（あなたを含む）</label><select id="count"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></div><button class="btn" id="start">対戦を始める</button></div><div class="status" id="setupNote">人数を選び、「対戦を始める」を押してください。手札枚数は2人:24枚／3人:20枚／4〜6人:16枚／7〜8人:12枚／9〜10人:8枚です。</div><p class="small">※実物カード110枚の番号・失点数・色別牛マークを登録したカードデータを使用しています。</p></section>
<section class="panel hidden" id="game"><div class="head"><h2 style="margin:0 0 10px;font-size:18px">場のカード列 <span class="tag" id="round">第1ターン</span></h2><button class="btn alt" id="restart" disabled>最初からやり直す</button></div><div class="board" id="board"></div><div class="result" id="message">手札からカードを1枚選んでください。</div></section>
<section class="panel hidden" id="handPanel"><h2 style="font-size:18px;margin:0">手札 <span class="tag" id="handCount"></span></h2><div class="hand" id="hand"></div><div class="actions"><button class="btn" id="play" disabled>このカードを出す</button></div><p class="small">手札からカードを1枚選び、「このカードを出す」を押してください。CPUもカードを選び、数字の小さい順に処理します。</p></section>
<section class="panel hidden" id="scorePanel"><h2 style="font-size:18px;margin:0 0 10px">対戦状況</h2><div class="players" id="players"></div></section>
<section class="panel hidden" id="endPanel"><h2 style="font-size:20px;margin:0">対戦終了</h2><div id="final"></div><div class="actions"><button class="btn" id="again">もう一度遊ぶ</button></div></section>
</main>
<script>
const COLORS=['blue','red','green','yellow','black','white'];
const HAND={2:24,3:20,4:16,5:16,6:16,7:12,8:12,9:8,10:8};
let players=[],lanes=[],selected=null,selectedLane=null,turn=0,finished=false,deck=[],CARD_DATA=[],pendingMoves=[],pendingIndex=0,turnLogs=[];
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
async function start(){let count=+$('count').value,handSize=HAND[count];$('start').disabled=true;$('restart').disabled=true;$('setupNote').textContent='正式カードデータを読み込んでいます…';try{if(!CARD_DATA.length){const response=await fetch('/baron-nimmt/cards.json',{cache:'no-store'});if(!response.ok)throw new Error('カードデータを読み込めませんでした');const raw=await response.json();CARD_DATA=raw.cards.map(([n,penalty,ids])=>({n,penalty,cs:ids.map(i=>raw.colors[i]),special:n===52||n===104}));}if(CARD_DATA.length!==110)throw new Error('カードデータが110枚ではありません');deck=shuffle(CARD_DATA.map(c=>({...c,cs:[...c.cs]})));}catch(e){$('setupNote').textContent=e.message;$('start').disabled=false;return;}finally{$('start').disabled=false;$('restart').disabled=false;}players=Array.from({length:count},(_,i)=>({name:i===0?'あなた':'CPU '+i,hand:deck.splice(0,handSize).sort((a,b)=>a.n-b.n),taken:[],isMe:i===0}));lanes=Array.from({length:5},()=>[deck.pop()]);turn=0;selected=null;selectedLane=null;finished=false;pendingMoves=[];pendingIndex=0;turnLogs=[];$('setupPanel').classList.add('hidden');$('game').classList.remove('hidden');$('handPanel').classList.remove('hidden');$('scorePanel').classList.remove('hidden');$('endPanel').classList.add('hidden');$('restart').disabled=false;render();$('message').textContent='手札からカードを1枚選んでください。';}
function bullCount(card){return card.penalty}
function scoreCards(cards){return cards.reduce((s,c)=>s+c.penalty,0)}
function cardHTML(c){return '<div class="card"><b>'+c.n+'</b><span>🐂</span><div class="bulls">'+c.cs.map(x=>'<i class="dot '+x+'"></i>').join('')+'</div></div>'}
function render(){
 $('round').textContent='第'+(turn+1)+'ターン';
 const active=pendingMoves[pendingIndex];
 const focusCard=active&&active.p.isMe?active.c:players[0]?.hand.find(c=>c.n===selected);
 const eligible=focusCard?matchingRows(focusCard):[];
 $('board').innerHTML=lanes.map((l,i)=>'<div class="lane '+(eligible.includes(i)?'target':'')+(selectedLane===i?' chosen':'')+'" data-lane="'+i+'"><h3>'+(i+1)+'列目 · '+l.length+'枚</h3><div class="cards">'+l.map(cardHTML).join('')+'</div></div>').join('');
 $('board').querySelectorAll('.target').forEach(el=>el.onclick=()=>{const lane=+el.dataset.lane;if(active&&active.p.isMe){const log=resolveCard(active.p,active.c,lane);turnLogs.push(log);pendingIndex++;selectedLane=null;continueTurn();}else{selectedLane=lane;render();}});
 $('handCount').textContent=players[0].hand.length+'枚';
 $('hand').innerHTML=players[0].hand.map(c=>'<button class="handcard '+(selected===c.n?'selected':'')+'" data-n="'+c.n+'" '+(pendingMoves.length?'disabled':'')+'><b>'+c.n+'</b><span>🐂</span><div class="bulls">'+c.cs.map(x=>'<i class="dot '+x+'"></i>').join('')+'</div></button>').join('');
 $('hand').querySelectorAll('button').forEach(btn=>btn.onclick=()=>{selected=+btn.dataset.n;selectedLane=null;render();});
 $('play').disabled=selected===null||finished||pendingMoves.length>0;
 $('play').textContent='このカードを出す';
 if(active&&active.p.isMe){$('message').textContent='あなたのカード（'+active.c.n+'）を処理します。置く列を選んでください。';}
 renderPlayers();
}
function matchingRows(card){return lanes.map((l,i)=>l[l.length-1].cs.some(c=>card.cs.includes(c))?i:-1).filter(i=>i>=0)}
function lanePenalty(lane,card){let same=card.cs.filter(c=>lane[lane.length-1].cs.includes(c)).length;return scoreCards(lane)+same*2}
function chooseCpuCard(p){let best=p.hand[0],bestVal=Infinity;for(const c of p.hand){let rows=matchingRows(c);let val;if(!rows.length)val=100+Math.min(...lanes.map(l=>scoreCards(l)));else val=Math.min(...rows.map(i=>{let l=lanes[i];return l.length>=5?scoreCards(l)+20:scoreCards(l)+l.length*.35}));if(val<bestVal){bestVal=val;best=c}}return best}
function takeLane(i,player,played,reason){let old=lanes[i].slice(0,-1);player.taken.push(...old);lanes[i]=[played];return old.length}
function resolveCard(player,card,manualLane=null){let rows=matchingRows(card);let chosen;if(!rows.length){chosen=lanes.map((l,i)=>({i,v:scoreCards(l)})).sort((a,b)=>a.v-b.v)[0].i;let n=takeLane(chosen,player,card,'no-match');return player.name+'：同色の列なし → '+(chosen+1)+'列目を引き取り（'+n+'枚）';}
chosen=manualLane!==null&&rows.includes(manualLane)?manualLane:rows.sort((a,b)=>lanes[a].length-lanes[b].length||scoreCards(lanes[a])-scoreCards(lanes[b]))[0];let lane=lanes[chosen];if(lane.length>=5){let n=takeLane(chosen,player,card,'sixth');return player.name+'：6枚目 → '+(chosen+1)+'列目を引き取り（'+n+'枚）';}
lane.push(card);let totals=COLORS.map(color=>lane.reduce((s,c)=>s+c.cs.filter(x=>x===color).length,0));if(Math.max(...totals)>=6){let n=takeLane(chosen,player,card,'color');return player.name+'：同色6つ以上 → '+(chosen+1)+'列目を引き取り（'+n+'枚）';}
return player.name+'：'+card.n+'を'+(chosen+1)+'列目へ配置';}
function playTurn(){
 if(selected===null||finished||pendingMoves.length)return;
 const chosen=players[0].hand.find(c=>c.n===selected);
 pendingMoves=[{p:players[0],c:chosen}];
 players[0].hand=players[0].hand.filter(c=>c.n!==selected);
 for(let i=1;i<players.length;i++){const c=chooseCpuCard(players[i]);players[i].hand=players[i].hand.filter(x=>x.n!==c.n);pendingMoves.push({p:players[i],c});}
 pendingMoves.sort((x,y)=>x.c.n-y.c.n);pendingIndex=0;turnLogs=[];selected=null;selectedLane=null;turn++;
 continueTurn();
}
function continueTurn(){
 while(pendingIndex<pendingMoves.length){
  const move=pendingMoves[pendingIndex];
  if(move.p.isMe&&matchingRows(move.c).length){render();return;}
  turnLogs.push(resolveCard(move.p,move.c,null));pendingIndex++;
 }
 pendingMoves=[];pendingIndex=0;selectedLane=null;render();
 $('message').innerHTML='<b>今回の処理結果</b><br>'+turnLogs.join('<br>');
 if(players[0].hand.length===0){finished=true;showEnd();}
}
function renderPlayers(){$('players').innerHTML=players.map(p=>'<div class="player '+(p.isMe?'me':'')+'"><strong>'+p.name+'</strong><p>手札：'+p.hand.length+'枚</p><p>獲得カード：'+p.taken.length+'枚</p><p>失点：'+scoreCards(p.taken)+'</p></div>').join('');}
function showEnd(){ $('handPanel').classList.add('hidden');$('endPanel').classList.remove('hidden');let ranking=players.map(p=>({p,s:scoreCards(p.taken)})).sort((a,b)=>a.s-b.s);$('final').innerHTML='<div class="result">'+ranking.map((x,i)=>(i+1)+'位：'+x.p.name+' — '+x.s+'点').join('<br>')+'<br><br><b>'+(ranking[0].p.isMe?'あなたの勝ち！':ranking[0].p.name+'の勝ち！')+'</b></div>';renderPlayers();}
$('start').onclick=start;$('restart').onclick=start;$('play').onclick=playTurn;$('again').onclick=start;
</script></body></html>
