<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f8c"><title>ボードゲームで遊ぼう｜ゲーム一覧</title>
<style>
:root{--teal:#087f8c;--deep:#075b67;--ink:#23343a;--muted:#65777d;--line:#d8e2e2;--shadow:0 10px 30px #173c4615}*{box-sizing:border-box}body{margin:0;background:#f3f7f6;color:var(--ink);font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;line-height:1.7}
header{background:linear-gradient(120deg,var(--deep),var(--teal));color:white;padding:42px 18px 46px;text-align:center}.brand{font-size:12px;letter-spacing:.16em;opacity:.85}h1{font-size:clamp(28px,5vw,44px);line-height:1.3;margin:13px 0 9px}header p{margin:0;color:#e1f1ef;font-size:14px}
main{max-width:680px;margin:34px auto 60px;padding:0 17px}.section-title{text-align:center;font-size:23px;margin:0 0 7px}.lead{text-align:center;color:var(--muted);font-size:13px;margin:0 0 26px}.selector{background:white;border:1px solid var(--line);border-radius:19px;padding:25px 22px 24px;box-shadow:var(--shadow)}label{display:block;font-weight:750;font-size:14px;margin-bottom:10px}.game-select{width:100%;min-height:54px;padding:0 42px 0 15px;border:1px solid #b9cccc;border-radius:11px;background:#fff;color:var(--ink);font-size:16px;font-family:inherit}.game-select:focus-visible{outline:3px solid #e7ae45;outline-offset:3px}.action{display:block;width:100%;margin-top:17px;border:0;border-radius:11px;background:var(--teal);color:white;padding:14px 16px;font:750 15px inherit;cursor:pointer}.action:disabled{background:#aabbbb;cursor:not-allowed}.hint{text-align:center;color:var(--muted);font-size:12px;margin:15px 0 0}.coming{border:1px dashed #b8caca;border-radius:16px;padding:20px;text-align:center;color:var(--muted);font-size:13px;margin-top:20px;background:#f8fbfa}footer{text-align:center;color:#879496;font-size:11px;padding:18px}
@media(max-width:640px){header{padding:32px 16px 35px}.selector{padding:21px 17px}}
</style></head><body>
<header><div class="brand">BOARD GAME PLAYGROUND</div><h1>ボードゲームで遊ぼう！</h1><p>遊びたいゲームを選んでください。</p></header>
<main><h2 class="section-title">ゲームを選択</h2><p class="lead">遊びたいゲームをプルダウンから選んでください。</p>
<section class="selector" aria-label="ゲーム選択"><label for="game-select">遊ぶゲーム</label><select id="game-select" class="game-select"><option value="">ゲームを選択してください</option><option value="/baron-nimmt">ニムト男爵</option><option value="/acquire">アクワイア</option><option value="/catan">カタン</option></select><button id="start-game" class="action" type="button" disabled>このゲームで遊ぶ</button><p class="hint">ゲームを選択すると、遊べるようになります。</p></section>
<div class="coming">ゲームは順次追加予定です。追加されたゲームは、このプルダウンから選べるようになります。</div></main>
<script>
const select = document.getElementById('game-select');
const button = document.getElementById('start-game');
select.addEventListener('change', () => { button.disabled = !select.value; });
button.addEventListener('click', () => { if (select.value) window.location.href = select.value; });
</script><footer>BOARD GAME PLAYGROUND</footer></body></html>
