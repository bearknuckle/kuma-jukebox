<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f8c"><title>ボードゲームで遊ぼう｜ゲーム一覧</title>
<style>
:root{--teal:#087f8c;--deep:#075b67;--ink:#23343a;--muted:#65777d;--line:#d8e2e2;--shadow:0 10px 30px #173c4615}*{box-sizing:border-box}body{margin:0;background:#f3f7f6;color:var(--ink);font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;line-height:1.7}
header{background:linear-gradient(120deg,var(--deep),var(--teal));color:white;padding:42px 18px 46px;text-align:center}.brand{font-size:12px;letter-spacing:.16em;opacity:.85}h1{font-size:clamp(28px,5vw,44px);line-height:1.3;margin:13px 0 9px}header p{margin:0;color:#e1f1ef;font-size:14px}
main{max-width:960px;margin:34px auto 60px;padding:0 17px}.section-title{text-align:center;font-size:23px;margin:0 0 7px}.lead{text-align:center;color:var(--muted);font-size:13px;margin:0 0 26px}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px}
.game{display:flex;flex-direction:column;background:white;border:1px solid var(--line);border-radius:19px;overflow:hidden;box-shadow:var(--shadow);text-decoration:none;color:inherit;transition:transform .18s}.game:hover{transform:translateY(-4px)}.visual{min-height:170px;display:grid;place-items:center;background:linear-gradient(135deg,#e3f3f0,#f7f5e9)}
.cards{display:flex;align-items:center;gap:9px}.tile{width:56px;height:76px;border:1px solid #d5c6a4;border-radius:9px;background:#fff8e9;box-shadow:0 4px 10px #00000012;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:23px;font-weight:800;color:#493b2b;transform:rotate(-7deg)}.tile:nth-child(2){transform:translateY(-8px)}.tile:nth-child(3){transform:rotate(7deg)}
.content{padding:20px 21px 22px;display:flex;flex-direction:column;flex:1}.tag{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--teal)}h2{font-size:22px;margin:7px 0}.content p{font-size:13px;color:var(--muted);line-height:1.8;margin:0 0 18px;flex:1}.action{display:flex;align-items:center;justify-content:space-between;background:var(--teal);color:white;border-radius:11px;padding:12px 15px;font-size:14px;font-weight:750}.arrow{font-size:20px}.coming{border:1px dashed #b8caca;border-radius:16px;padding:20px;text-align:center;color:var(--muted);font-size:13px;margin-top:20px;background:#f8fbfa}footer{text-align:center;color:#879496;font-size:11px;padding:18px}a:focus-visible{outline:3px solid #e7ae45;outline-offset:4px}
@media(max-width:640px){header{padding:32px 16px 35px}.visual{min-height:135px}.tile{width:49px;height:66px}.content{padding:17px 18px 19px}}
</style></head><body>
<header><div class="brand">BOARD GAME PLAYGROUND</div><h1>ボードゲームで遊ぼう！</h1><p>遊びたいゲームを選んでください。</p></header>
<main><h2 class="section-title">ゲーム一覧</h2><p class="lead">気になるゲームを選んで、さっそく遊んでみましょう。</p>
<div class="games"><a class="game" href="/baron-nimmt"><div class="visual"><div class="cards"><div class="tile">12<small>🐂</small></div><div class="tile">38<small>🐂</small></div><div class="tile">71<small>🐂</small></div></div></div><div class="content"><span class="tag">PLAY NOW</span><h2>ニムト男爵</h2><p>カードを出して列を作り、牛マークによる失点をできるだけ少なくしよう。チュートリアルとCPU対戦で遊べます。</p><span class="action">このゲームで遊ぶ <span class="arrow">›</span></span></div></a></div>
<div class="coming">ゲームは順次追加予定です。新しいゲームもこちらの一覧から選べるようになります。</div></main><footer>BOARD GAME PLAYGROUND</footer></body></html>
