<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f8c"><title>ニムト男爵｜オンライン対戦</title>
<style>
:root{--teal:#087f8c;--deep:#075b67;--ink:#23343a;--muted:#65777d;--line:#d8e2e2;--shadow:0 8px 24px #173c4614}
*{box-sizing:border-box}body{margin:0;background:#f3f7f6;color:var(--ink);font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;line-height:1.65}
header{background:linear-gradient(120deg,var(--deep),var(--teal));color:white;padding:18px max(16px,calc((100vw - 760px)/2))}.brand{font-size:12px;letter-spacing:.12em;opacity:.85}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.head h1{font-size:clamp(22px,4vw,30px);margin:5px 0}.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.nav a{color:white;text-decoration:none;border:1px solid #ffffff80;border-radius:30px;padding:8px 12px;font-size:12px;white-space:nowrap}
main{max-width:760px;margin:22px auto;padding:0 14px 50px}.panel{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:clamp(16px,3vw,24px);margin-bottom:15px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{flex:1;border:1px solid var(--line);background:#f7faf9;border-radius:10px;padding:11px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer}.tab.active{background:#eaf6f4;border-color:var(--teal);color:var(--deep)}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}.field{width:100%;padding:12px;border:1px solid #cbd9d9;border-radius:10px;font:inherit;background:white}.btn{border:0;border-radius:11px;padding:12px 16px;background:var(--teal);color:white;font-weight:750;font:inherit;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.alt{background:#eaf1f1;color:var(--deep)}.btn.danger{background:#f8e9e7;color:#a33f35}.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1}.hint,.small{font-size:12px;color:var(--muted);line-height:1.7}.error{color:#b23e35;font-size:13px;margin-top:10px}.roomcode{font-size:clamp(30px,8vw,42px);font-weight:850;letter-spacing:.16em;color:var(--deep);text-align:center;padding:10px}.player{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--line);border-radius:11px;margin-top:8px}.host{font-size:11px;background:#eaf6f4;color:var(--deep);border-radius:20px;padding:3px 8px}.status{border-radius:10px;background:#f1f7f6;padding:12px;font-size:13px;margin:12px 0}.hidden{display:none!important}
 .version{display:inline-block;margin-left:8px;padding:2px 7px;border:1px solid #ffffff70;border-radius:20px;font-size:10px;letter-spacing:.04em;opacity:.9;vertical-align:middle}</style></head><body>
<header><div class="brand">BOARD GAME PLAYGROUND <span class="version">v0.2.0</span></div><div class="head"><h1>ニムト男爵 オンライン対戦</h1><div class="nav"><a href="/baron-nimmt">トップページへ戻る</a><a href="/baron-nimmt/cpu">CPU対戦へ</a></div></div></header>
<main>
<section class="panel" id="entry">
<div class="tabs"><button class="tab active" id="createTab">ルームを作る</button><button class="tab" id="joinTab">ルームに参加</button></div>
<div id="createForm"><label for="createName">あなたの名前</label><input class="field" id="createName" maxlength="16" placeholder="プレイヤー名"><label for="maxPlayers">最大参加人数（あなたを含む）</label><select class="field" id="maxPlayers"><option value="2">2人</option><option value="3">3人</option><option value="4" selected>4人</option><option value="5">5人</option><option value="6">6人</option><option value="7">7人</option><option value="8">8人</option><option value="9">9人</option><option value="10">10人</option></select><button class="btn" id="createBtn" style="width:100%;margin-top:16px">ルームを作成</button></div>
<div id="joinForm" class="hidden"><label for="joinName">あなたの名前</label><input class="field" id="joinName" maxlength="16" placeholder="プレイヤー名"><label for="joinCode">ルーム番号（6桁）</label><input class="field" id="joinCode" maxlength="6" autocomplete="off" placeholder="例：A2BCDE" style="text-transform:uppercase;letter-spacing:.12em"><button class="btn" id="joinBtn" style="width:100%;margin-top:16px">このルームに参加</button></div>
<div class="error" id="error" role="alert"></div><p class="hint">ルーム番号を知っている友達だけが参加できます。作成者が開始すると、空いている人数分のCPUが自動で参加します。</p>
</section>
<section class="panel hidden" id="lobby"><h2 style="margin:0;font-size:19px">待機ルーム</h2><div class="roomcode" id="roomCode"></div><button class="btn alt" id="copyBtn" style="width:100%">ルーム番号をコピー</button><div class="status" style="text-align:center"><strong>QRコードで友達を招待</strong><p class="small">読み取ると参加画面が開き、ルーム番号が自動入力されます。</p><div id="roomQr" style="display:inline-flex;background:white;padding:10px;border-radius:10px;min-width:180px;min-height:180px;align-items:center;justify-content:center"></div><div class="small" id="qrFallback"></div></div><div class="status" id="lobbyStatus">参加者を待っています。</div><h3 style="font-size:15px;margin:18px 0 8px">参加メンバー <span class="small" id="memberCount"></span></h3><div id="members"></div><div class="row" style="margin-top:18px"><button class="btn" id="startBtn">ゲーム開始</button><button class="btn danger" id="leaveBtn">退出する</button></div><p class="small">開始時に空き人数分のCPUが参加します。全員がカードを選ぶと同時に公開され、数字の小さい順に処理されます。</p><div class="error" id="lobbyError"></div></section>
<section class="panel hidden" id="gamePanel">
  <div class="row" style="align-items:center"><h2 style="margin:0;font-size:19px;flex:2">対戦中 <span class="host" id="turnLabel">第1ターン</span></h2><button class="btn alt" id="gameLeaveBtn">退出</button></div>
  <div class="status" id="connectionStatus" role="status">接続中</div><div class="status" id="gameStatus">手札からカードを1枚選んでください。</div><div class="status hidden" id="resolutionReveal"></div>
  <h3 style="font-size:15px;margin:14px 0 8px">場の5列</h3><div class="board" id="onlineBoard"></div><div class="status hidden" id="laneChoice"></div><div class="current-play hidden" id="currentPlay"></div>
  <h3 style="font-size:15px;margin:18px 0 8px">あなたの手札</h3><div class="hand" id="onlineHand"></div>
  <button class="btn" id="submitCardBtn" style="width:100%" disabled>このカードを提出</button><button class="btn danger hidden" id="cancelCardBtn" style="width:100%;margin-top:8px">提出したカードを取り消す</button>
  <h3 style="font-size:15px;margin:18px 0 8px">プレイヤー</h3><div id="onlinePlayers"></div>
  <div class="status" id="turnLog"></div>
  <div class="result hidden" id="onlineResult"></div>
</section>
</main>
<style>
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.lane{min-width:0;background:#f7faf9;border:1px solid var(--line);border-radius:10px;padding:6px 3px;text-align:center}
.lane h4{font-size:11px;color:var(--muted);margin:0 0 6px}
.current-play{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-top:8px;border:2px solid #d49a18;border-radius:10px;background:#fff7df}.current-play .played{min-width:58px;min-height:68px;font-size:21px}.played{height:72px;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff8e9;border:1px solid #d8c9a8;border-radius:6px;padding:5px 2px;margin:4px auto;max-width:55px;font-weight:800;font-size:14px}.played .color-dots{min-height:18px;align-content:center}
.color-dots{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.blue{background:#4c83b8}.red{background:#c85d51}.green{background:#398c69}.yellow{background:#d9a52d}.black{background:#303b42}.white{background:white;border:1px solid #aeb9bd}
.hand{display:flex;gap:7px;overflow-x:auto;padding:8px 2px 13px}
.lane.target{border:2px solid var(--teal);background:#eaf6f4;cursor:pointer;box-shadow:0 0 0 2px #087f8c22}.lane.chosen{border:3px solid #d49a18;background:#fff0bf;box-shadow:0 0 0 3px #d49a1833,0 4px 12px #8a641b25}
.lane.target:after{content:"ここに置く";display:block;color:var(--deep);font-size:10px;font-weight:800;margin-top:5px}
.handcard{flex:0 0 62px;border:2px solid #d5c6a4;border-radius:9px;background:#fff8e9;padding:8px 3px;text-align:center;font-weight:800;font-size:20px;color:#493b2b}
.handcard.selected{outline:3px solid #65aaa0;border-color:var(--teal);transform:translateY(-3px)}
.player.me{border-color:var(--teal);background:#eef8f6}
@media(max-width:600px){.head{align-items:flex-start;flex-direction:column}.nav{width:100%;justify-content:flex-start}
 header{padding:18px 16px 20px}
 .head{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:10px}
 .head h1{font-size:clamp(23px,6vw,28px);line-height:1.35;margin:4px 0 0;max-width:100%;overflow-wrap:anywhere}
 .nav{width:100%;display:flex;justify-content:flex-start}
 .nav a{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 16px;white-space:nowrap}
}
@media(max-width:480px){.board{gap:3px}.lane{padding:4px 1px}.played{height:66px;min-height:66px;font-size:12px}.lane h4{font-size:9px}.handcard{flex-basis:56px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id);let code=null,playerId=null,isHost=false,pollHandle=null,lastStatus="",selectedCard=null,selectedLane=null,latestGame=null,retryDelay=1500,refreshBusy=false;
const SESSION_KEY="baronNimmtOnlineSession";
function saveSession(){if(code&&playerId)localStorage.setItem(SESSION_KEY,JSON.stringify({code,playerId,isHost}));}
function clearSession(){localStorage.removeItem(SESSION_KEY);}
function connectionState(text,kind="ok"){$("connectionStatus").textContent=text;$("connectionStatus").style.background=kind==="ok"?"#e9f6ef":kind==="retry"?"#fff5df":"#fbeceb";}
function showError(msg,where="error"){$(where).textContent=msg||""}
function tab(which){$("createForm").classList.toggle("hidden",which!=="create");$("joinForm").classList.toggle("hidden",which!=="join");$("createTab").classList.toggle("active",which==="create");$("joinTab").classList.toggle("active",which==="join");showError("")}
async function api(url,body){const r=await fetch(url,{method:body?"POST":"GET",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined,cache:"no-store"});const d=await r.json();if(!r.ok)throw new Error(d.error||"通信に失敗しました。");return d}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function enterLobby(room){$("entry").classList.add("hidden");$("lobby").classList.remove("hidden");$("roomCode").textContent=room.code;renderRoom(room);makeRoomQr(room.code);saveSession();if(pollHandle)clearInterval(pollHandle);pollHandle=setInterval(refresh,1800);connectionState("接続中");}
function makeRoomQr(roomCode){const target=location.origin+"/baron-nimmt/online?room="+encodeURIComponent(roomCode);const box=$("roomQr");box.innerHTML="";if(window.QRCode){new QRCode(box,{text:target,width:180,height:180,colorDark:"#12343a",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});$("qrFallback").textContent="";}else{$("qrFallback").textContent="QRコードを読み込めません。ルーム番号をコピーして共有してください。";}}
function renderRoom(room){$("memberCount").textContent=room.players.length+" / "+room.max_players+"人";$("members").innerHTML=room.players.map(p=>'<div class="player"><strong>'+escapeHtml(p.name)+'</strong>'+(p.is_host?'<span class="host">ルーム作成者</span>':'')+'</div>').join("");$("startBtn").disabled=!isHost||room.players.length<1||room.status!=="waiting";$("startBtn").textContent=room.status==="waiting"?"ゲーム開始":"ゲーム開始済み";$("lobbyStatus").textContent=room.status==="waiting"?(room.players.length<room.max_players?"空き人数分のCPUを追加して開始できます。友達の参加を待つこともできます。":"参加者が揃っています。作成者はゲームを開始できます。"):"ゲームを準備しています。"}
function cardHtml(c){return '<div class="played">'+c.n+'<div class="color-dots">'+c.cs.map(x=>'<i class="dot '+x+'"></i>').join("")+'</div></div>'}
function renderGame(g){
 latestGame=g;$("lobby").classList.add("hidden");$("gamePanel").classList.remove("hidden");$("turnLabel").textContent="第"+(g.turn+1)+"ターン";
 const selectedForLane=g.my_hand.find(c=>c.n===selectedCard);
 const eligibleLanes=g.must_choose_lane&&g.pending_choice_mode==="place"?g.pending_lanes:(selectedForLane?g.lanes.map((lane,i)=>({lane,i})).filter(x=>x.lane[x.lane.length-1].cs.some(color=>selectedForLane.cs.includes(color))).map(x=>x.i):[]);
 const choosingNow=g.must_choose_lane&&g.pending_choice_mode==="place";
 $("onlineBoard").innerHTML=g.lanes.map((lane,i)=>'<div class="lane '+(choosingNow&&eligibleLanes.includes(i)?"target":"")+(selectedLane===i?" chosen":"")+'" data-target-lane="'+i+'"><h4>'+ (i+1)+'列目 · '+lane.length+'枚</h4>'+lane.map(cardHtml).join("")+'</div>').join("");
 $("onlineBoard").querySelectorAll(".target").forEach(el=>el.onclick=async()=>{const lane=+el.dataset.targetLane;el.style.opacity=".6";try{const d=await api("/api/rooms/"+code+"/choose-lane",{player_id:playerId,lane_index:lane});selectedLane=null;renderGame(d.game)}catch(e){$("gameStatus").textContent=e.message;renderGame(g)}});
 const currentPlay=$("currentPlay");
 if(g.must_choose_lane&&g.pending_choice_mode==="place"){
   const activeCard=g.pending_card;
   currentPlay.classList.remove("hidden");
   currentPlay.innerHTML="<b>今回置くカード</b>"+(activeCard?cardHtml(activeCard):"<strong>"+g.pending_card_number+"</strong>");
 }else{currentPlay.classList.add("hidden");currentPlay.textContent="";}
 const choice=$("laneChoice");
 if(g.must_choose_lane&&g.pending_choice_mode==="take"){
   choice.classList.remove("hidden");
   choice.innerHTML="<b>置ける列がありません。</b><br>引き取る列を選んでください。<div class='row' style='margin-top:10px'>"+g.lanes.map((lane,i)=>"<button class='btn alt' data-lane='"+i+"'>"+(i+1)+"列目を引き取る</button>").join("")+"</div>";
   choice.querySelectorAll("button").forEach(btn=>btn.onclick=async()=>{btn.disabled=true;try{const d=await api("/api/rooms/"+code+"/choose-lane",{player_id:playerId,lane_index:+btn.dataset.lane});renderGame(d.game)}catch(e){$("gameStatus").textContent=e.message;btn.disabled=false}});
 }else if(g.must_choose_lane&&g.pending_choice_mode==="place"){
   choice.classList.remove("hidden");choice.textContent="あなたのカード（"+g.pending_card_number+"）を処理する番です。置く列を選んでください。";
 }else{
   choice.classList.toggle("hidden",!g.pending_choice);
   choice.textContent=g.pending_choice?(g.pending_player_name+"さんが引き取る列を選択しています。"):"";
 }
 const reveal=$("resolutionReveal");
 if(g.revealed_cards&&g.revealed_cards.length){reveal.classList.remove("hidden");reveal.innerHTML="<b>公開カード・処理順</b><br>"+g.revealed_cards.map((x,i)=>(i+1)+". "+escapeHtml(x.player_name)+"：<b>"+x.card_number+"</b>").join("　／　");}else{reveal.classList.add("hidden");reveal.textContent="";}
 $("onlinePlayers").innerHTML=g.players.map(p=>'<div class="player '+(p.id===playerId?"me":"")+'"><strong>'+escapeHtml(p.name)+(p.id===playerId?"（あなた）":"")+'</strong><div class="small">手札 '+p.hand_count+'枚 / 獲得 '+p.taken_count+'枚 / 失点 '+p.score+'点</div><div class="small">'+(p.submitted?"カード提出済み":"選択中")+'</div></div>').join("");
 $("onlineHand").innerHTML=g.my_hand.map(c=>'<button class="handcard '+(selectedCard===c.n?"selected":"")+'" data-n="'+c.n+'" '+(g.my_submitted||g.status==="finished"?"disabled":"")+'>'+c.n+'<div class="color-dots">'+c.cs.map(x=>'<i class="dot '+x+'"></i>').join("")+'</div><div class="small">'+c.penalty+'点</div></button>').join("");
 $("onlineHand").querySelectorAll("button").forEach(b=>b.onclick=()=>{selectedCard=+b.dataset.n;selectedLane=null;renderGame(g)});
 $("submitCardBtn").disabled=selectedCard===null||g.my_submitted||g.status==="finished"||g.must_choose_lane;
 $("submitCardBtn").textContent=g.my_submitted?"提出済み・処理順を待っています":"このカードを提出";
 const cancelBtn=$("cancelCardBtn");
 const canCancel=g.my_submitted&&g.submitted_count<g.players.length&&g.status==="playing"&&!g.must_choose_lane;
 cancelBtn.classList.toggle("hidden",!canCancel);
 cancelBtn.disabled=!canCancel;
 $("gameStatus").textContent=g.status==="finished"?"対戦が終了しました。":g.must_choose_lane&&g.pending_choice_mode==="place"?"あなたのカード（"+g.pending_card_number+"）を処理する番です。置く列を選んでください。":g.must_choose_lane&&g.pending_choice_mode==="take"?"置ける列がありません。引き取る列を選択してください。":g.pending_choice?g.pending_player_name+"さんのカードを処理しています。":g.my_submitted?"カードを提出しました。他のプレイヤーの提出と処理順を待っています。":selectedCard===null?"手札からカードを1枚選んでください。":"カードを選んで提出してください。全員の提出後、数字の小さい順に処理し、自分の番に置く列を選びます。";
 $("turnLog").innerHTML=g.last_log.length?'<b>前のターンの結果</b><br>'+g.last_log.map(escapeHtml).join("<br>"):"";
 if(g.status==="finished"){$("onlineResult").classList.remove("hidden");$("onlineResult").innerHTML="<b>ゲーム終了！</b><br>"+g.players.slice().sort((a,b)=>a.score-b.score).map((p,i)=>(i+1)+"位："+escapeHtml(p.name)+" — "+p.score+"点").join("<br>")+"<br><br>勝者："+g.winner.map(escapeHtml).join("、");}
}
async function refresh(){if(!code||refreshBusy)return;refreshBusy=true;try{const d=await api("/api/rooms/"+code);const member=d.room.players.find(p=>p.id===playerId);if(!member){clearSession();if(pollHandle)clearInterval(pollHandle);pollHandle=null;code=null;playerId=null;$("lobby").classList.add("hidden");$("entry").classList.remove("hidden");connectionState("参加情報が失われました","retry");showError("このルームの参加情報が確認できません。新しいルームを作成するか、もう一度参加してください。");return;}isHost=member.is_host;renderRoom(d.room);if(d.room.status==="playing"||d.room.status==="finished"){const gd=await api("/api/rooms/"+code+"/game?player_id="+encodeURIComponent(playerId));renderGame(gd.game);}connectionState("接続中");retryDelay=1500;showError("","lobbyError");}catch(e){if(/ルームが終了したか、見つかりません/.test(e.message)||/ルームが見つかりません/.test(e.message)){clearSession();if(pollHandle)clearInterval(pollHandle);pollHandle=null;code=null;playerId=null;$("lobby").classList.add("hidden");$("entry").classList.remove("hidden");connectionState("ルームが終了しました","retry");showError("サーバー再起動などでルーム情報が失われました。新しいルームを作成してください。");}else{connectionState("接続が不安定です。再接続しています…","retry");$("gameStatus").textContent="通信が回復するまで自動で再接続します。";}}finally{refreshBusy=false;}} 
async function restoreSession(){let saved;try{saved=JSON.parse(localStorage.getItem(SESSION_KEY)||"null")}catch(e){clearSession()}if(!saved||!saved.code||!saved.playerId)return false;code=saved.code;playerId=saved.playerId;isHost=!!saved.isHost;try{const d=await api("/api/rooms/"+code);const member=d.room.players.find(p=>p.id===playerId);if(!member){clearSession();code=null;playerId=null;return false;}isHost=member.is_host;$("entry").classList.add("hidden");$("lobby").classList.remove("hidden");$("roomCode").textContent=d.room.code;renderRoom(d.room);makeRoomQr(d.room.code);if(d.room.status==="playing"||d.room.status==="finished"){const gd=await api("/api/rooms/"+code+"/game?player_id="+encodeURIComponent(playerId));renderGame(gd.game);}if(pollHandle)clearInterval(pollHandle);pollHandle=setInterval(refresh,1800);connectionState("再接続しました");return true;}catch(e){connectionState("重新連線中…","retry");if(pollHandle)clearInterval(pollHandle);pollHandle=setInterval(refresh,2500);return true;}}
async function leave(){try{await api("/api/rooms/"+code+"/leave",{player_id:playerId})}catch(e){}if(pollHandle)clearInterval(pollHandle);clearSession();code=null;playerId=null;location.reload()}
const invitedRoom=new URLSearchParams(location.search).get("room");if(invitedRoom){tab("join");$("joinCode").value=invitedRoom.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);$("joinName").focus();}
$("createTab").onclick=()=>tab("create");$("joinTab").onclick=()=>tab("join");
$("createBtn").onclick=async()=>{showError("");try{const d=await api("/api/rooms",{name:$("createName").value,max_players:$("maxPlayers").value});code=d.room.code;playerId=d.player_id;isHost=true;saveSession();enterLobby(d.room)}catch(e){showError(e.message)}};
$("joinBtn").onclick=async()=>{showError("");try{const d=await api("/api/rooms/"+$("joinCode").value.trim().toUpperCase()+"/join",{name:$("joinName").value});code=d.room.code;playerId=d.player_id;isHost=false;saveSession();enterLobby(d.room)}catch(e){showError(e.message)}};
$("copyBtn").onclick=async()=>{try{await navigator.clipboard.writeText(code);$("copyBtn").textContent="コピーしました！"}catch(e){$("copyBtn").textContent="番号："+code}};
$("startBtn").onclick=async()=>{try{await api("/api/rooms/"+code+"/start",{player_id:playerId});await refresh()}catch(e){showError(e.message,"lobbyError")}};
$("submitCardBtn").onclick=async()=>{if(selectedCard===null)return;try{const d=await api("/api/rooms/"+code+"/play",{player_id:playerId,card_number:selectedCard});selectedCard=null;selectedLane=null;renderGame(d.game)}catch(e){$("gameStatus").textContent=e.message}};
$("cancelCardBtn").onclick=async()=>{const btn=$("cancelCardBtn");btn.disabled=true;try{const d=await api("/api/rooms/"+code+"/cancel",{player_id:playerId});selectedCard=null;selectedLane=null;renderGame(d.game)}catch(e){$("gameStatus").textContent=e.message;btn.disabled=false;refresh()}};
$("leaveBtn").onclick=leave;$("gameLeaveBtn").onclick=leave;
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&code)refresh();});
window.addEventListener("online",()=>{if(code){connectionState("通信復旧。再接続中…","retry");refresh();}});
window.addEventListener("offline",()=>connectionState("オフラインです。通信の復旧を待っています。","error"));
restoreSession();
</script></body></html>
