<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f8c"><title>ニムト男爵｜オンライン対戦</title>
<style>
:root{--teal:#087f8c;--deep:#075b67;--ink:#23343a;--muted:#65777d;--line:#d8e2e2;--shadow:0 8px 24px #173c4614}
*{box-sizing:border-box}body{margin:0;background:#f3f7f6;color:var(--ink);font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;line-height:1.65}
header{background:linear-gradient(120deg,var(--deep),var(--teal));color:white;padding:18px max(16px,calc((100vw - 760px)/2))}.brand{font-size:12px;letter-spacing:.12em;opacity:.85}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.head h1{font-size:clamp(22px,4vw,30px);margin:5px 0}.nav a{color:white;text-decoration:none;border:1px solid #ffffff80;border-radius:30px;padding:8px 12px;font-size:12px}
main{max-width:760px;margin:22px auto;padding:0 14px 50px}.panel{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:clamp(16px,3vw,24px);margin-bottom:15px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{flex:1;border:1px solid var(--line);background:#f7faf9;border-radius:10px;padding:11px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer}.tab.active{background:#eaf6f4;border-color:var(--teal);color:var(--deep)}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}.field{width:100%;padding:12px;border:1px solid #cbd9d9;border-radius:10px;font:inherit;background:white}.btn{border:0;border-radius:11px;padding:12px 16px;background:var(--teal);color:white;font-weight:750;font:inherit;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.alt{background:#eaf1f1;color:var(--deep)}.btn.danger{background:#f8e9e7;color:#a33f35}.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1}.hint,.small{font-size:12px;color:var(--muted);line-height:1.7}.error{color:#b23e35;font-size:13px;margin-top:10px}.roomcode{font-size:clamp(30px,8vw,42px);font-weight:850;letter-spacing:.16em;color:var(--deep);text-align:center;padding:10px}.player{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--line);border-radius:11px;margin-top:8px}.host{font-size:11px;background:#eaf6f4;color:var(--deep);border-radius:20px;padding:3px 8px}.status{border-radius:10px;background:#f1f7f6;padding:12px;font-size:13px;margin:12px 0}.hidden{display:none!important}
 .version{display:inline-block;margin-left:8px;padding:2px 7px;border:1px solid #ffffff70;border-radius:20px;font-size:10px;letter-spacing:.04em;opacity:.9;vertical-align:middle}</style></head><body>
<header><div class="brand">BOARD GAME PLAYGROUND <span class="version">v0.2.0</span></div><div class="head"><h1>ニムト男爵 オンライン対戦</h1><div class="nav"><a href="/baron-nimmt/cpu">CPU対戦へ</a></div></div></header>
<main>
<section class="panel" id="entry">
<div class="tabs"><button class="tab active" id="createTab">ルームを作る</button><button class="tab" id="joinTab">ルームに参加</button></div>
<div id="createForm"><label for="createName">あなたの名前</label><input class="field" id="createName" maxlength="16" placeholder="プレイヤー名"><label for="maxPlayers">最大参加人数（あなたを含む）</label><select class="field" id="maxPlayers"><option value="2">2人</option><option value="3">3人</option><option value="4" selected>4人</option><option value="5">5人</option><option value="6">6人</option><option value="7">7人</option><option value="8">8人</option><option value="9">9人</option><option value="10">10人</option></select><button class="btn" id="createBtn" style="width:100%;margin-top:16px">ルームを作成</button></div>
<div id="joinForm" class="hidden"><label for="joinName">あなたの名前</label><input class="field" id="joinName" maxlength="16" placeholder="プレイヤー名"><label for="joinCode">ルーム番号（6桁）</label><input class="field" id="joinCode" maxlength="6" autocomplete="off" placeholder="例：A2BCDE" style="text-transform:uppercase;letter-spacing:.12em"><button class="btn" id="joinBtn" style="width:100%;margin-top:16px">このルームに参加</button></div>
<div class="error" id="error" role="alert"></div><p class="hint">ルーム番号を知っている友達だけが参加できます。参加者が2人以上になると、作成者が開始できます。</p>
</section>
<section class="panel hidden" id="lobby"><h2 style="margin:0;font-size:19px">待機ルーム</h2><div class="roomcode" id="roomCode"></div><button class="btn alt" id="copyBtn" style="width:100%">ルーム番号をコピー</button><div class="status" id="lobbyStatus">参加者を待っています。</div><h3 style="font-size:15px;margin:18px 0 8px">参加メンバー <span class="small" id="memberCount"></span></h3><div id="members"></div><div class="row" style="margin-top:18px"><button class="btn" id="startBtn">ゲーム開始</button><button class="btn danger" id="leaveBtn">退出する</button></div><p class="small">全員がカードを選ぶと同時に公開され、数字の小さい順に処理されます。</p><div class="error" id="lobbyError"></div></section>
<section class="panel hidden" id="gamePanel">
  <div class="row" style="align-items:center"><h2 style="margin:0;font-size:19px;flex:2">対戦中 <span class="host" id="turnLabel">第1ターン</span></h2><button class="btn alt" id="gameLeaveBtn">退出</button></div>
  <div class="status" id="gameStatus">手札からカードを1枚選んでください。</div>
  <h3 style="font-size:15px;margin:14px 0 8px">場の5列</h3><div class="board" id="onlineBoard"></div>
  <h3 style="font-size:15px;margin:18px 0 8px">プレイヤー</h3><div id="onlinePlayers"></div>
  <h3 style="font-size:15px;margin:18px 0 8px">あなたの手札</h3><div class="hand" id="onlineHand"></div>
  <button class="btn" id="submitCardBtn" style="width:100%" disabled>このカードを提出</button>
  <div class="status" id="turnLog"></div>
  <div class="result hidden" id="onlineResult"></div>
</section>
</main>
<style>
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.lane{min-width:0;background:#f7faf9;border:1px solid var(--line);border-radius:10px;padding:6px 3px;text-align:center}
.lane h4{font-size:11px;color:var(--muted);margin:0 0 6px}
.played{background:#fff8e9;border:1px solid #d8c9a8;border-radius:6px;padding:5px 2px;margin:4px auto;max-width:55px;font-weight:800;font-size:14px}
.color-dots{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.blue{background:#4c83b8}.red{background:#c85d51}.green{background:#398c69}.yellow{background:#d9a52d}.black{background:#303b42}.white{background:white;border:1px solid #aeb9bd}
.hand{display:flex;gap:7px;overflow-x:auto;padding:8px 2px 13px}
.handcard{flex:0 0 62px;border:2px solid #d5c6a4;border-radius:9px;background:#fff8e9;padding:8px 3px;text-align:center;font-weight:800;font-size:20px;color:#493b2b}
.handcard.selected{outline:3px solid #65aaa0;border-color:var(--teal);transform:translateY(-3px)}
.player.me{border-color:var(--teal);background:#eef8f6}
@media(max-width:480px){.board{gap:3px}.lane{padding:4px 1px}.played{font-size:12px}.lane h4{font-size:9px}.handcard{flex-basis:56px}}
</style>
<script>
const $=id=>document.getElementById(id);let code=null,playerId=null,isHost=false,pollHandle=null,lastStatus="",selectedCard=null,latestGame=null;
function showError(msg,where="error"){$(where).textContent=msg||""}
function tab(which){$("createForm").classList.toggle("hidden",which!=="create");$("joinForm").classList.toggle("hidden",which!=="join");$("createTab").classList.toggle("active",which==="create");$("joinTab").classList.toggle("active",which==="join");showError("")}
async function api(url,body){const r=await fetch(url,{method:body?"POST":"GET",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined,cache:"no-store"});const d=await r.json();if(!r.ok)throw new Error(d.error||"通信に失敗しました。");return d}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function enterLobby(room){$("entry").classList.add("hidden");$("lobby").classList.remove("hidden");$("roomCode").textContent=room.code;renderRoom(room);if(pollHandle)clearInterval(pollHandle);pollHandle=setInterval(refresh,1000)}
function renderRoom(room){$("memberCount").textContent=room.players.length+" / "+room.max_players+"人";$("members").innerHTML=room.players.map(p=>'<div class="player"><strong>'+escapeHtml(p.name)+'</strong>'+(p.is_host?'<span class="host">ルーム作成者</span>':'')+'</div>').join("");$("startBtn").disabled=!isHost||room.players.length<2||room.status!=="waiting";$("startBtn").textContent=room.status==="waiting"?"ゲーム開始":"ゲーム開始済み";$("lobbyStatus").textContent=room.status==="waiting"?(room.players.length<2?"友達にルーム番号を共有して、参加を待ちましょう。":"参加者が揃っています。作成者はゲームを開始できます。"):"ゲームを準備しています。"}
function cardHtml(c){return '<div class="played">'+c.n+'<div class="color-dots">'+c.cs.map(x=>'<i class="dot '+x+'"></i>').join("")+'</div></div>'}
function renderGame(g){
 latestGame=g;$("lobby").classList.add("hidden");$("gamePanel").classList.remove("hidden");$("turnLabel").textContent="第"+(g.turn+1)+"ターン";
 $("onlineBoard").innerHTML=g.lanes.map((lane,i)=>'<div class="lane"><h4>'+ (i+1)+'列目 · '+lane.length+'枚</h4>'+lane.map(cardHtml).join("")+'</div>').join("");
 $("onlinePlayers").innerHTML=g.players.map(p=>'<div class="player '+(p.id===playerId?"me":"")+'"><strong>'+escapeHtml(p.name)+(p.id===playerId?"（あなた）":"")+'</strong><div class="small">手札 '+p.hand_count+'枚 / 獲得 '+p.taken_count+'枚 / 失点 '+p.score+'点</div><div class="small">'+(p.submitted?"カード提出済み":"選択中")+'</div></div>').join("");
 $("onlineHand").innerHTML=g.my_hand.map(c=>'<button class="handcard '+(selectedCard===c.n?"selected":"")+'" data-n="'+c.n+'" '+(g.my_submitted||g.status==="finished"?"disabled":"")+'>'+c.n+'<div class="color-dots">'+c.cs.map(x=>'<i class="dot '+x+'"></i>').join("")+'</div><div class="small">'+c.penalty+'点</div></button>').join("");
 $("onlineHand").querySelectorAll("button").forEach(b=>b.onclick=()=>{selectedCard=+b.dataset.n;renderGame(g)});
 $("submitCardBtn").disabled=selectedCard===null||g.my_submitted||g.status==="finished";
 $("submitCardBtn").textContent=g.my_submitted?"提出済み・他のプレイヤーを待っています":"このカードを提出";
 $("gameStatus").textContent=g.status==="finished"?"対戦が終了しました。":g.my_submitted?"カードを提出しました。他のプレイヤーの選択を待っています。":"手札から1枚選んで提出してください。全員が提出すると自動で公開されます。";
 $("turnLog").innerHTML=g.last_log.length?'<b>前のターンの結果</b><br>'+g.last_log.map(escapeHtml).join("<br>"):"";
 if(g.status==="finished"){$("onlineResult").classList.remove("hidden");$("onlineResult").innerHTML="<b>ゲーム終了！</b><br>"+g.players.slice().sort((a,b)=>a.score-b.score).map((p,i)=>(i+1)+"位："+escapeHtml(p.name)+" — "+p.score+"点").join("<br>")+"<br><br>勝者："+g.winner.map(escapeHtml).join("、");}
}
async function refresh(){if(!code)return;try{const d=await api("/api/rooms/"+code);renderRoom(d.room);if(d.room.status==="playing"||d.room.status==="finished"){const gd=await api("/api/rooms/"+code+"/game?player_id="+encodeURIComponent(playerId));renderGame(gd.game);}}catch(e){showError(e.message,"lobbyError");$("gameStatus").textContent=e.message;if(pollHandle)clearInterval(pollHandle);pollHandle=null}}
async function leave(){try{await api("/api/rooms/"+code+"/leave",{player_id:playerId})}catch(e){}if(pollHandle)clearInterval(pollHandle);code=null;playerId=null;location.reload()}
$("createTab").onclick=()=>tab("create");$("joinTab").onclick=()=>tab("join");
$("createBtn").onclick=async()=>{showError("");try{const d=await api("/api/rooms",{name:$("createName").value,max_players:$("maxPlayers").value});code=d.room.code;playerId=d.player_id;isHost=true;enterLobby(d.room)}catch(e){showError(e.message)}};
$("joinBtn").onclick=async()=>{showError("");try{const d=await api("/api/rooms/"+$("joinCode").value.trim().toUpperCase()+"/join",{name:$("joinName").value});code=d.room.code;playerId=d.player_id;isHost=false;enterLobby(d.room)}catch(e){showError(e.message)}};
$("copyBtn").onclick=async()=>{try{await navigator.clipboard.writeText(code);$("copyBtn").textContent="コピーしました！"}catch(e){$("copyBtn").textContent="番号："+code}};
$("startBtn").onclick=async()=>{try{await api("/api/rooms/"+code+"/start",{player_id:playerId});await refresh()}catch(e){showError(e.message,"lobbyError")}};
$("submitCardBtn").onclick=async()=>{if(selectedCard===null)return;try{const d=await api("/api/rooms/"+code+"/play",{player_id:playerId,card_number:selectedCard});selectedCard=null;renderGame(d.game)}catch(e){$("gameStatus").textContent=e.message}};
$("leaveBtn").onclick=leave;$("gameLeaveBtn").onclick=leave;
window.addEventListener("beforeunload",()=>{if(code&&playerId)navigator.sendBeacon("/api/rooms/"+code+"/leave",new Blob([JSON.stringify({player_id:playerId})],{type:"application/json"}))});
</script></body></html>
