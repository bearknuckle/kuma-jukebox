<style>
/* VOICE: 楽しい・夜の店先のジュークボックス
   IDEA: 本物のジュークボックスの選曲パネル（番号つきの曲札を押すと鳴る）
   PICTURE: 上部に丸いアーチ枠の中で動画（ビジュアライザー）が流れる
   COLOUR/TYPE: 深いワインレッド地、クリーム文字、ミントとコーラルのアクセント / M PLUS Rounded 1c
   LAYOUT: アーチ型の画面 → 操作ボタン → 絞り込み → 曲札グリッド */
:root{--bg:#2b0d16;--panel:#3d1420;--ink:#fbefe0;--sub:#e9c9b4;--mint:#5fe0b5;--coral:#ff7a5c;--line:#5c2433}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#5a1a2a 0,var(--bg) 60%);background-color:var(--bg);color:var(--ink);font:16px/1.55 "M PLUS Rounded 1c",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:clamp(18px,4vw,40px) max(4vw,14px) 60px}
h1{font-size:clamp(28px,5vw,44px);line-height:1.05;margin:0 0 4px;text-align:center;font-weight:800;letter-spacing:.02em}
.lead{text-align:center;color:var(--sub);margin:0 0 22px;font-size:15px}
.cab{background:linear-gradient(#4a1826,#33101b);border:3px solid #c98b5a;border-radius:220px 220px 26px 26px;padding:clamp(26px,6vw,56px) clamp(14px,3vw,30px) 22px;box-shadow:0 0 0 6px #2b0d16,0 0 0 9px #7a3a2c,0 24px 60px #0008}
.screen{position:relative;aspect-ratio:16/9;max-width:760px;margin:0 auto;border-radius:18px;overflow:hidden;background:#000;box-shadow:inset 0 0 0 2px #0006}
.screen iframe,#player{position:absolute;inset:0;width:100%;height:100%}
.mix{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-weight:800;font-size:clamp(22px,5.5vw,46px);line-height:1.25;letter-spacing:.02em;text-align:center;padding:0 8%;color:#fff;opacity:0;background:radial-gradient(circle,#ff7a5c88,#5fe0b522 60%,transparent 75%);text-shadow:0 0 24px #ff7a5c}
.mix.go{animation:mix 1.6s ease-out}
.mix.type{opacity:1;font-family:"M PLUS Rounded 1c",ui-monospace,monospace;background:#14060ad9;text-shadow:0 0 14px #5fe0b5;color:#eafff6;transition:opacity .5s}
.mix.type.out{opacity:0}
.mix .caret{color:#5fe0b5;animation:blink .7s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
@keyframes mix{0%{opacity:0;transform:scale(.7)}25%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1.25)}}
.nextup{display:block;font-size:13px;color:var(--sub);font-weight:500;margin-top:2px}
@media(prefers-reduced-motion:reduce){.mix.go{animation:none}}
.outlink:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.wakemsg{text-align:center;color:var(--sub);font-size:13px;margin:8px 0 0}
.now{text-align:center;margin:16px 0 4px;font-weight:800;font-size:19px;min-height:1.6em}
.badge{display:inline-block;font-size:13px;padding:1px 9px;border-radius:99px;vertical-align:2px;margin-left:6px;font-weight:800}
.b-sub{background:var(--mint);color:#12382c}.b-vid{background:#ffd36e;color:#3a2a00}.b-yt{background:var(--coral);color:#3a0f06}
button{font:inherit;color:inherit;cursor:pointer}
/* 操作部：再生ボタンを中心に、モード3つ・外部3つを同じ幅でそろえる */
.ctrl{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:10px}
.ctrl button{width:52px;height:52px;border-radius:50%;border:2px solid #c98b5a;background:#5a1d2c;font-size:18px;display:grid;place-items:center;padding:0}
.ctrl button.big{width:68px;height:68px;font-size:24px;background:#c98b5a;color:#2b0d16;border-color:#e3ac7e}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:560px;margin:14px auto 0}
.row button,.outlink{min-height:46px;padding:6px 8px;border-radius:14px;font-weight:800;font-size:14px;line-height:1.3;text-align:center;display:flex;align-items:center;justify-content:center}
.modes button{border:2px solid #c98b5a;background:#5a1d2c}
.modes button[aria-pressed=true],.out button[aria-pressed=true]{background:var(--mint);color:#12382c;border-color:var(--mint)}
.out{margin-top:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.out button,.outlink{border:2px solid var(--line);background:var(--panel);color:var(--sub);font-size:13px;text-decoration:none}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:760px;margin:28px auto 16px}
.tabs button{min-height:46px;padding:6px 8px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-weight:800;font-size:14px;line-height:1.3}

button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.tabs button[aria-selected=true]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px;list-style:none;padding:0;margin:0}
.card{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px;min-height:72px;transition:transform .15s}

.card.on{border-color:var(--mint);box-shadow:0 0 0 2px var(--mint)}
.card img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;flex:none;background:#000}
.num{font-size:13px;color:var(--sub);font-weight:800}
.ttl{font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.search input::placeholder{color:#b8909a}
.search input:focus{outline:none;border-color:#ffd36e;box-shadow:0 0 0 3px #ffd36e44}

.msg{text-align:center;color:var(--sub);padding:30px 0}
.qrbg{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:50;padding:20px}
.qrbg[hidden]{display:none}
.qrbox{width:min(360px,100%);background:#3d1420;border:3px solid #c98b5a;border-radius:24px;padding:20px;text-align:center}
.qrttl{margin:0 0 12px;font-weight:800;font-size:19px}
.qrseg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.qrseg button{min-height:44px;border-radius:12px;border:2px solid #5c2433;background:#2b0d16;font-weight:800;font-size:14px}
.qrseg button[aria-selected=true]{background:#c98b5a;border-color:#c98b5a;color:#2b0d16}
.qrseg button:disabled{opacity:.4}
#qrImg{width:100%;max-width:260px;aspect-ratio:1;background:#fff;border-radius:14px;padding:12px;display:block;margin:0 auto}
.qrurl{white-space:pre-line;font-size:12px;color:var(--sub);overflow-wrap:anywhere;margin:10px 0 2px}
.qrnote{font-size:12px;color:#b8909a;margin:0 0 14px}
.qrclose{min-height:46px;width:100%;border-radius:14px;border:2px solid #c98b5a;background:#5a1d2c;font-weight:800}
.stat{text-align:center;color:#b8909a;font-size:12px;margin:24px 0 0}
.links{text-align:center;margin-top:34px;font-size:14px;color:var(--sub)}
.links a{color:var(--mint)}
@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
@media(max-width:600px){.card img{width:84px}}

/* ===== アイコンに合わせた見た目：くま耳のジュークボックス、3色のネオンアーチ、レコード、台座 ===== */
body{background:radial-gradient(ellipse 120% 70% at 50% 0,#5a1a2a 0,var(--bg) 70%) fixed;background-color:var(--bg)}
h1{display:flex;align-items:center;justify-content:center;gap:12px}
.logo{width:clamp(40px,7vw,56px);height:auto;border-radius:12px;flex:none}

.rainbow i{height:4px;border-radius:4px;background:#ff7a5c}.rainbow i:nth-child(2){background:#ffd36e;margin:0 14px}.rainbow i:nth-child(3){background:#5fe0b5;margin:0 28px}
.cab{position:relative;margin-top:64px;background:linear-gradient(#8a2b3f,#4a1826 70%);border:8px solid #c98b5a;border-bottom:none;border-radius:300px 300px 0 0;box-shadow:0 24px 60px #0008;padding-top:clamp(18px,4vw,34px)}
.ear{position:absolute;top:-34px;width:clamp(70px,13vw,104px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#ff7a5c 0 48%,#c98b5a 49%);z-index:-1}
.ear.l{left:8%}.ear.r{right:8%}
.neon{display:block;width:min(92%,700px);height:clamp(50px,9vw,96px);margin:0 auto 10px;overflow:visible}
.neon path{fill:none;stroke-width:9;stroke-linecap:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 6px currentColor)}
.neon path:nth-child(1){color:#ff7a5c}.neon path:nth-child(2){color:#ffd36e}.neon path:nth-child(3){color:#5fe0b5}
.playing .neon path{animation:glow 1.8s ease-in-out infinite alternate}
.playing .neon path:nth-child(2){animation-delay:.3s}.playing .neon path:nth-child(3){animation-delay:.6s}
@keyframes glow{to{opacity:.55}}
.screen{border:4px solid #c98b5a}
.share{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid #c98b5a;background:#5a1d2c;color:var(--ink);display:grid;place-items:center;padding:0}
.toast{text-align:center;margin:6px 0 0;font-size:13px;font-weight:800;color:#5fe0b5}
.nowrow{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px auto 4px;max-width:700px}
.nowrow .now{margin:0;text-align:left}
.disc{width:44px;height:44px;flex:none;border-radius:50%;border:3px solid #c98b5a;background:radial-gradient(circle,#14060a 0 12%,#ff7a5c 13% 30%,#14060a 31% 44%,#3a1a22 45% 47%,#14060a 48% 62%,#3a1a22 63% 65%,#14060a 66%)}
.playing .disc{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cab,.plinth{max-width:880px;margin-left:auto;margin-right:auto}
.plinth{height:22px;width:calc(100% + 12px);max-width:892px;margin-top:0;position:relative;left:0;border-radius:0 0 14px 14px;background:#c98b5a;box-shadow:0 14px 30px #0007}
.ctrl button.big{background:#ff7a5c;border-color:#ffd36e;color:#2b0d16}
.tabs button[aria-selected=true]{background:#c98b5a;border-color:#c98b5a;color:#2b0d16}
.card{border-color:#5c2433}.card:hover{border-color:#c98b5a}
.card.on{border-color:#ffd36e;box-shadow:0 0 0 2px #ffd36e,0 0 18px #ffd36e55}
@media(max-width:600px){h1{flex-direction:column;gap:6px}.plinth{margin-left:-6px}.cab{border-width:6px;border-radius:180px 180px 0 0;margin-top:50px}.ear{top:-26px}.disc{width:36px;height:36px}}
@media(prefers-reduced-motion:reduce){.playing .disc,.playing .neon path{animation:none}}
</style>
</head>

{

  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm = s => String(s || '').normalize('NFKC').toLowerCase().replace(/[【\[(（].*?[】\])）]/g, '').replace(/[\s　・\-_/|｜:："'「」『』!！?？.,、。~〜]/g, '');
  const badge = o => o.sub ? '<span class="badge b-sub">サブスク</span>' : o.subvid ? '<span class="badge b-vid">サブスク曲の動画</span>' : '<span class="badge b-yt">YouTube限定</span>';
  const kind = o => o.sub ? 'sub' : o.subvid ? 'vid' : 'yt';

  async function title(id) {
    try {
      const r = await fetch('https://noembed.com/embed?url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + id));
      const j = await r.json(); return (j && j.title) || '';
    } catch (e) { return ''; }
  }
  async function titlesFor(ids) {
    const out = {}; let k = 0;
    const w = async () => { while (k < ids.length) { const id = ids[k++]; out[id] = await title(id); } };
    await Promise.all([w(), w(), w(), w()]); return out;
  }
  // 再生リストの動画IDを、見えないプレーヤーで取り出す
  function getList(listId) {
    return new Promise(res => {
      const d = document.createElement('div'); d.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px';
      const h = document.createElement('div'); d.appendChild(h); document.body.appendChild(d);
      let n = 25, done = false;
      const finish = v => { if (done) return; done = true; try { p.destroy(); } catch (e) {} d.remove(); res(v); };
      const p = new YT.Player(h, {playerVars: {listType: 'playlist', list: listId}, events: {
        onReady: () => { const poll = () => { const l = p.getPlaylist && p.getPlaylist(); if (l && l.length) finish(l); else if (n-- > 0) setTimeout(poll, 400); else finish([]); }; poll(); },
        onApiChange: captionsOff,
        onError: () => finish([])
      }});
      setTimeout(() => finish([]), 15000);
    });
  }

  // メインのプレーヤーに再生リストを順番に読み込ませて、動画IDを取り出す
  function cueList(listId, prev, tries, index) {
    return new Promise(res => {
      let n = tries || 40;
      try { player.cuePlaylist({listType: 'playlist', list: listId, index: index || 0}); } catch (e) { return res([]); }
      const poll = () => {
        const l = player.getPlaylist && player.getPlaylist();
        const fresh = l && l.length && !(prev && prev.length && l[0] === prev[0] && l.length === prev.length);
        if (fresh) res(l.slice()); else if (n-- > 0) setTimeout(poll, 400); else res([]);
      };
      setTimeout(poll, 300);
    });
  }
  function view() { return items.map((o, i) => ({...o, i})).filter(o => !o.hide && !EXCLUDE_WORDS.some(w => (o.t || '').toUpperCase().includes(w.toUpperCase())) && !EXCLUDE_TITLES.some(t => norm(o.t).startsWith(norm(t))) && !EXCLUDE_EXACT.some(t => exact(o.t) === exact(t))).filter(o => filter === 'all' || filter === kind(o)).filter(o => !query || norm(o.t).includes(query)); }
  function render() {
    const list = view();
    grid.innerHTML = list.map((o, n) => '<li><button class="card' + (o.i === current ? ' on' : '') + '" data-i="' + o.i + '">' +
      '<img loading="lazy" alt="" src="https://i.ytimg.com/vi/' + esc(o.id) + '/mqdefault.jpg">' +
      '<span><span class="num">No.' + String(n + 1).padStart(2, '0') + '</span>' + badge(o) +
      '<span class="ttl">' + esc(o.t || ('Track ' + (o.i + 1))) + '</span></span></button></li>').join('');
    msg.hidden = list.length > 0;
    if (!list.length && items.length) msg.textContent = query ? '「' + qInput.value + '」に合う曲はありません' : 'この棚にはまだ曲がありません';
    try { updateOut(); } catch (e) {}
    const st = document.getElementById('stat');
    if (st && items.length) st.textContent = '読み込んだ動画・曲 ' + items.length + '本（表示中 ' + view().length + '本）';
  }
  function playAt(i) {
    if (!items[i]) return;
    try { history.replaceState(null, '', '#' + items[i].id); } catch (e) {}
    if (attract) stopAttract();
    current = i; quickStart = null; djStart = null; djWhoosh = false; djQueued = null; djHush = false;
    if (dj) {
      // DJモード：頭の音が出ないように、音を消してから入る位置で読み込む
      djHush = true;
      try { player.mute(); } catch (e) {}
      const sec = items[i].sec;
      player.loadVideoById({videoId: items[i].id, startSeconds: sec > 100 ? Math.floor(sec * 0.3) : 0});
    } else player.loadVideoById(items[i].id);
    render(); setNow();
  }
  function step(d) {
    if (!items.length) return;
    if (dj && d === 1) { const j = djPick(); if (j != null) return playAt(j); }
    const pool = view().map(o => o.i); if (!pool.length) return;
    if (shuffle) { let j; do { j = pool[Math.floor(Math.random() * pool.length)]; } while (pool.length > 1 && j === current); return playAt(j); }
    const at = pool.indexOf(current);
    playAt(pool[(at + d + pool.length) % pool.length]);
  }

  async function build() {
    // F-Pagの動画一覧：全動画（UU）と通常動画（UULF）の両方を読み、ショート（UUSH）だけ除く
    // （UULFだけだと古い動画が入らないことがあるため）
    const loadAll = async (listId, prev) => {
      let l = await cueList(listId, prev);
      // 再生リストは一度に200本ずつしか取れないことがあるので、古い動画も続けて取りに行く
      for (let guard = 0; guard < 10 && l.length >= 190; guard++) {
        const more = await cueList(listId, l.slice(-200), 20, l.length);
        const add = more.filter(id => !l.includes(id));
        if (!add.length) break;
        l = l.concat(add);
      }
      return l;
    };
    const longs = await loadAll('UULF' + FPAG_CHANNEL.slice(2), null);
    const all = await loadAll(uploads(FPAG_CHANNEL), longs);
    const shorts = all.length > longs.length ? await loadAll('UUSH' + FPAG_CHANNEL.slice(2), all) : [];
    const shortSet = new Set(shorts.filter(id => !longs.includes(id)));
    let fpag = [...new Set(all.concat(longs))].filter(id => !shortSet.has(id));
    // 自動で入らなかった曲を、動画IDで直接足す
    INCLUDE_IDS.forEach(id => { if (!fpag.includes(id)) fpag.push(id); });
    try { player.stopVideo(); } catch (e) {}
    const ft = await titlesFor(fpag);
    const extra = EXTRA_SUB_TITLES.map(norm).filter(k => k.length >= 2);
    items = fpag.map(id => ({id, t: ft[id], sub: false, subvid: extra.some(k => norm(ft[id]).includes(k))}));
    items.forEach(o => { if (INCLUDE_IDS.includes(o.id)) return; if (!o.sub && LONG_WORDS.some(w => (o.t || '').toLowerCase().includes(w.toLowerCase()))) o.hide = true; });

    render();
    now.textContent = fpag.length ? '好きな曲を選んでください' : 'サブスク配信曲を読み込み中…';
    openShared();
    await addSubs(fpag);
    // 長い動画・ショート・ライブを外す（YouTube限定のみ）。まずはラボのサーバー（YouTube公式API）で長さを調べる
    const targets = items.filter(o => !o.fromTopic && !o.sub && !o.hide && !INCLUDE_IDS.includes(o.id));
    let apiOk = false;
    for (let i = 0; i < targets.length; i += 50) {
      try {
        const r = await fetch(INFO_API + '?ids=' + targets.slice(i, i + 50).map(o => o.id).join(','));
        const d = await r.json(); if (!d.api) break; apiOk = true;
        targets.slice(i, i + 50).forEach(o => {
          const f = d.info[o.id]; if (!f) return;
          if (f.sec > MAX_SECONDS || (f.sec > 0 && f.sec <= 60) || f.live !== 'none') o.hide = true;
          o.cat = f.cat; o.sec = f.sec;
        });
      } catch (e) { break; }
    }
    if (apiOk) render();
    // APIが使えないときは、まだ何も再生していない間に、1本ずつプレーヤーに読み込んで長さを調べる
    for (const o of (apiOk ? [] : items.slice())) {
      if (current >= 0) break;
      if (o.fromTopic || o.sub || o.hide || INCLUDE_IDS.includes(o.id)) continue;
      const sec = await cueDuration(o.id);
      if (sec > MAX_SECONDS) { o.hide = true; render(); }
    }
    if (current < 0) { try { player.stopVideo(); } catch (e) {} }
    ready = true;
    if (current < 0) startAttract();
  }

  function cueDuration(id) {
    return new Promise(res => {
      let n = 15;
      try { player.cueVideoById(id); } catch (e) { return res(0); }
      const poll = () => {
        if (current >= 0) return res(0);
        const d = player.getVideoData && player.getVideoData();
        const sec = player.getDuration && player.getDuration();
        if (sec > 0 && d && d.video_id === id) res(sec); else if (n-- > 0) setTimeout(poll, 200); else res(0);
      };
      setTimeout(poll, 200);
    });
  }

  // 動画の長さ（秒）を、見えないプレーヤーに1本ずつ読み込ませて調べる
  function durationsFor(ids) {
    return new Promise(res => {
      const out = {};
      const d = document.createElement('div'); d.style.cssText = 'position:absolute;width:200px;height:120px;left:-9999px;top:0';
      const h = document.createElement('div'); d.appendChild(h); document.body.appendChild(d);
      let k = 0, p;
      const done = () => { try { p.destroy(); } catch (e) {} d.remove(); res(out); };
      const next = () => {
        if (k >= ids.length) return done();
        const id = ids[k++]; let n = 20;
        try { p.cueVideoById(id); } catch (e) { return done(); }
        const poll = () => {
          const sec = p.getDuration && p.getDuration();
          if (sec > 0) { out[id] = sec; next(); } else if (n-- > 0) setTimeout(poll, 200); else next();
        };
        setTimeout(poll, 200);
      };
      p = new YT.Player(h, {playerVars: {playsinline: 1}, events: {onReady: next, onError: () => {}}});
      setTimeout(done, 5 * 60 * 1000);
    });
  }

  // サブスク配信曲：ラボのサーバーがトピックチャンネルから集めた一覧を読み込む
  async function addSubs(prevList) {
    let data = null;
    for (let t = 0; t < 3 && !data; t++) {
      try {
        const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 70000);
        const r = await fetch(SUBS_API, {signal: ctl.signal}); clearTimeout(tm);
        if (r.ok) data = await r.json();
      } catch (e) {}
    }
    if (!data) { if (!items.length) msg.textContent = '曲リストを読み込めませんでした。時間をおいて再読み込みしてください'; return; }
    const merge = async list => {
      const ids = [...new Set(list)].filter(id => /^[\w-]{11}$/.test(id) && !items.some(o => o.id === id));
      if (!ids.length) return;
      const tt = await titlesFor(ids);
      ids.forEach(id => {
        const k = norm(tt[id]);
        // サブスク曲の名前が入ったF-Pagの動画は「サブスク曲の動画」の枠へ
        if (k.length >= 2) items.forEach(o => { if (!o.fromTopic && norm(o.t).includes(k)) o.subvid = true; });
        items.push({id, t: tt[id], sub: true, fromTopic: true});
      });
      render();
      openShared();
    };
    // まず届いた曲をすぐ並べる
    await merge((data.videos || []).map(v => v.id));
    if (current < 0) now.textContent = '好きな曲を選んでください';
    // まだ何も再生していなければ、アルバム（再生リスト）の中の残りの曲も取り出す
    let prev = prevList;
    for (const pl of (data.api ? EXTRA_SUB_PLAYLISTS : [...new Set(EXTRA_SUB_PLAYLISTS.concat(data.playlists || []))])) {
      if (current >= 0) break;
      if (!/^[\w-]{10,70}$/.test(pl)) continue;
      const l = await cueList(pl, prev, 12);
      if (l.length) { prev = l; await merge(l); }
    }
    if (current < 0) { try { player.stopVideo(); } catch (e) {} }
    if (current < 0) now.textContent = '好きな曲を選んでください';
  }

  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player('player', {
      playerVars: {playsinline: 1, rel: 0, cc_load_policy: 0, iv_load_policy: 3},
      events: {
        onReady: build,
        onStateChange: e => {
          captionsOff();
          if (attract) { playing = false; document.body.classList.remove('playing'); playBtn.textContent = '▶'; return; }
          playing = e.data === YT.PlayerState.PLAYING;
          clearTimeout(pauseTimer);
          // 一時停止のまま30秒たったら、音なしの動画を流しておく
          if (e.data === YT.PlayerState.PAUSED && ready) pauseTimer = setTimeout(() => {
            if (!playing && !attract && current >= 0) { resumeAt = player.getCurrentTime(); startAttract(); }
          }, 30000);
          document.body.classList.toggle('playing', playing);
          playBtn.textContent = playing ? '⏸' : '▶';
          if (e.data === YT.PlayerState.ENDED) step(1);
          // 再生してみて長すぎたYouTube限定の動画は、外して次の曲へ
          if (playing) {
            const o = items[current], sec = player.getDuration();
            if (o && !o.sub && sec > MAX_SECONDS) { o.hide = true; render(); step(1); }
          }
        },
        onError: () => setTimeout(() => attract ? attractNext() : step(1), 800)
      }
    });
  };

  grid.addEventListener('click', e => { const b = e.target.closest('.card'); if (b && player) playAt(+b.dataset.i); });
  playBtn.addEventListener('click', () => {
    if (!player || !items.length) return;
    if (current < 0) return step(1);
    if (attract) { stopAttract(); player.loadVideoById({videoId: items[current].id, startSeconds: resumeAt || 0}); return; }
    playing ? player.pauseVideo() : player.playVideo();
  });
  document.getElementById('next').addEventListener('click', () => step(1));
  document.getElementById('prev').addEventListener('click', () => step(-1));
  shufBtn.addEventListener('click', () => { shuffle = !shuffle; shufBtn.setAttribute('aria-pressed', shuffle); });
  // 15秒再生モード：どの曲も15秒流したら次の曲へ
  const QUICK_SECONDS = 15;
  let quick = false, quickStart = null;
  const quickBtn = document.getElementById('quick');
  quickBtn.addEventListener('click', () => {
    quick = !quick; quickBtn.setAttribute('aria-pressed', quick);
    quickBtn.textContent = '15秒ずつ';
    if (quick && dj) setDj(false);
    quickStart = null;
    if (quick && current < 0 && player && items.length) step(1);
  });
  // 字幕は常にオフ（読み込まれるたびに外す）
  function captionsOff() {
    if (!player) return;
    try { player.setOption('captions', 'track', {}); } catch (e) {}
    try { player.setOption('cc', 'track', {}); } catch (e) {}
    try { player.unloadModule('captions'); } catch (e) {}
    try { player.unloadModule('cc'); } catch (e) {}
  }
  setInterval(captionsOff, 2000);

  // ===== 待ち受け：再生していない間は、音なしの動画を15秒ずつ順番に流す =====
  const ATTRACT_SECONDS = 15;
  let attract = false, attractTimer = null, attractPos = -1, ready = false, pauseTimer = null, resumeAt = 0;
  function startAttract() {
    if (!player || !items.length) return;
    attract = true; document.body.classList.add('attract');
    try { player.mute(); } catch (e) {}
    attractNext();
  }
  function attractNext() {
    clearTimeout(attractTimer);
    if (!attract) return;
    const list = view(); if (!list.length) return;
    attractPos = (attractPos + 1) % list.length;
    try { player.loadVideoById({videoId: list[attractPos].id, startSeconds: 20}); } catch (e) {}
    attractTimer = setTimeout(attractNext, ATTRACT_SECONDS * 1000);
  }
  function stopAttract() {
    attract = false; clearTimeout(attractTimer); document.body.classList.remove('attract');
    try { player.unMute(); player.setVolume(100); } catch (e) {}
  }

  // ===== 曲ごとの共有リンク（URLの # のあとに動画ID）=====
  let sharedId = (location.hash.match(/^#([\w-]{11})$/) || [])[1] || null;
  function openShared() {
    if (!sharedId || !player) return;
    const i = items.findIndex(o => o.id === sharedId && !o.hide);
    if (i < 0) return;
    sharedId = null;
    if (attract) stopAttract();
    current = i;
    try { player.cueVideoById(items[i].id); } catch (e) {}
    render(); setNow();
    const card = grid.querySelector('[data-i="' + i + '"]');
    if (card) card.scrollIntoView({block: 'center'});
    window.scrollTo({top: 0});
  }
  const shareBtn = document.getElementById('share'), toast = document.getElementById('toast');
  let toastTimer;
  function say(t) { toast.textContent = t; toast.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.hidden = true, 2500); }
  shareBtn.addEventListener('click', async () => {
    const o = items[current]; if (!o) return;
    const url = location.origin + location.pathname + '#' + o.id;
    const title = (o.t || 'KUMA MUSIC') + '｜KUMA MUSIC ジュークボックス';
    if (navigator.share) { try { await navigator.share({title, url}); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(url); say('リンクをコピーしました'); } catch (e) { say(url); }
  });

  // ===== QRコード =====
  const qrBg = document.getElementById('qrbg'), qrImg = document.getElementById('qrImg'), qrUrl = document.getElementById('qrUrl');
  const qrSite = document.getElementById('qrSite'), qrSong = document.getElementById('qrSong');
  const SITE_URL = 'https://kuma-jukebox.onrender.com/';
  let qrMode = 'site';
  function drawQr() {
    const o = items[current];
    qrSong.disabled = !o;
    if (!o && qrMode === 'song') qrMode = 'site';
    qrSite.setAttribute('aria-selected', qrMode === 'site'); qrSong.setAttribute('aria-selected', qrMode === 'song');
    const url = qrMode === 'song' ? SITE_URL + '#' + o.id : SITE_URL;
    qrUrl.textContent = qrMode === 'song' ? (o.t || '') + '\n' + url : url;
    try {
      const q = qrcode(0, 'M'); q.addData(url); q.make();
      qrImg.src = q.createDataURL(8, 2);
    } catch (e) { qrImg.removeAttribute('src'); qrUrl.textContent = 'QRコードを作れませんでした。' + url; }
  }
  document.getElementById('qrBtn').addEventListener('click', () => { qrMode = items[current] ? 'song' : 'site'; drawQr(); qrBg.hidden = false; document.getElementById('qrClose').focus(); });
  qrSite.addEventListener('click', () => { qrMode = 'site'; drawQr(); });
  qrSong.addEventListener('click', () => { qrMode = 'song'; drawQr(); });
  document.getElementById('qrClose').addEventListener('click', () => { qrBg.hidden = true; });
  qrBg.addEventListener('click', e => { if (e.target === qrBg) qrBg.hidden = true; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') qrBg.hidden = true; });

  // ===== 検索 =====
  const qInput = document.getElementById('q'), qClear = document.getElementById('qclear');
  let query = '';
  qInput.addEventListener('input', () => { query = norm(qInput.value); qClear.hidden = !qInput.value; render(); });
  qInput.addEventListener('keydown', e => { if (e.key === 'Enter') qInput.blur(); });
  qClear.addEventListener('click', () => { qInput.value = ''; query = ''; qClear.hidden = true; render(); qInput.focus(); });

  // ===== 画面をつけたまま／アプリで続きを聴く =====
  const wakeBtn = document.getElementById('wake'), wakeMsg = document.getElementById('wakemsg');
  let wakeOn = false, wakeLock = null;
  async function grabWake() {
    try { wakeLock = await navigator.wakeLock.request('screen'); return true; } catch (e) { return false; }
  }
  wakeBtn.addEventListener('click', async () => {
    if (!('wakeLock' in navigator)) { wakeMsg.hidden = false; wakeMsg.textContent = 'この端末のブラウザでは使えません（iPhoneはiOS 16.4以降のSafariで使えます）'; return; }
    wakeOn = !wakeOn;
    if (wakeOn) { if (!(await grabWake())) { wakeOn = false; wakeMsg.hidden = false; wakeMsg.textContent = '画面をつけたままにできませんでした。もう一度押してみてください'; } else wakeMsg.hidden = true; }
    else { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
    wakeBtn.setAttribute('aria-pressed', wakeOn);
  });
  document.addEventListener('visibilitychange', () => { if (wakeOn && document.visibilityState === 'visible') grabWake(); });

  // いま選んでいるタブの曲を、いま流れている曲から順に並べる（最大50曲）
  function outIds() {
    const list = view().map(o => o.i);
    const at = list.indexOf(current);
    const order = at > 0 ? list.slice(at).concat(list.slice(0, at)) : list;
    return order.map(i => items[i].id).slice(0, 50);
  }
  function updateOut() {
    const ids = outIds();
    const yt = document.getElementById('toYt'), ytm = document.getElementById('toYtm');
    if (ids.length) yt.href = 'https://www.youtube.com/watch_videos?video_ids=' + ids.join(',');
    // YouTube Music：サブスク配信のタブはアーティストページ、それ以外は流れている曲（なければ先頭の曲）から続きを再生
    if (filter === 'sub') ytm.href = 'https://music.youtube.com/channel/UCRlaIisipjF9qL1zYkMMCug';
    else if (ids.length) ytm.href = 'https://music.youtube.com/watch?v=' + ids[0];
  }
  document.querySelector('.cab').addEventListener('pointerdown', e => { if (e.target.closest('.outlink')) updateOut(); });
  document.querySelector('.cab').addEventListener('focusin', e => { if (e.target.closest('.outlink')) updateOut(); });

  // ===== DJモード =====
  // ・各曲のいちばん盛り上がりやすい位置（曲の3割あたり）から60秒ずつ
  // ・終わり5秒で音を下げ、つなぎ目に「シュワッ」という効果音と MIX の演出、次の曲は低音のドンで入ってふわっと音量を上げる
  // ・次の曲は、サブスク／動画／YouTube限定をなるべく交互に、一周するまで同じ曲を流さない
  const DJ_SECONDS = 60, DJ_FADE = 5;
  const djBtn = document.getElementById('dj'), mixEl = document.getElementById('mix');
  let djHush = false;
  let dj = false, djStart = null, djFadeAt = 0, djWhoosh = false, djPlayed = new Set(), djQueued = null, ac = null;
  function setDj(on) {
    dj = on; djBtn.setAttribute('aria-pressed', on);
    if (!on) { djHush = false; try { player.unMute(); player.setVolume(100); } catch (e) {} setNow(); return; }
    if (quick) { quick = false; quickBtn.setAttribute('aria-pressed', false); quickBtn.textContent = '15秒ずつ'; }
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {}
    djPlayed = new Set(); djStart = null;
    if (current < 0 && items.length) step(1);
  }
  djBtn.addEventListener('click', () => setDj(!dj));
  function djPick() {
    const pool = view().map(o => o.i).filter(i => i !== current);
    if (!pool.length) return null;
    let left = pool.filter(i => !djPlayed.has(items[i].id));
    if (!left.length) { djPlayed = new Set(); left = pool; }
    const cur = items[current], other = cur ? left.filter(i => kind(items[i]) !== kind(cur)) : [];
    const from = other.length ? other : left;
    return from[Math.floor(Math.random() * from.length)];
  }
  function setNow() {
    const o = items[current]; if (!o) return;
    const nx = dj && djQueued != null && items[djQueued] ? '<span class="nextup">NEXT ▶ ' + esc(items[djQueued].t || '') + '</span>' : '';
    now.innerHTML = esc(o.t || '♪') + badge(o) + nx;
    shareBtn.hidden = false;
  }
  function sfx(type) {
    if (!ac) return;
    try {
      const t0 = ac.currentTime, g = ac.createGain(); g.connect(ac.destination);
      if (type === 'whoosh') {
        const len = 1.3, buf = ac.createBuffer(1, ac.sampleRate * len, ac.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const src = ac.createBufferSource(); src.buffer = buf;
        const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 3;
        f.frequency.setValueAtTime(300, t0); f.frequency.exponentialRampToValueAtTime(7000, t0 + len);
        g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.35, t0 + len * 0.8); g.gain.exponentialRampToValueAtTime(0.0001, t0 + len);
        src.connect(f); f.connect(g); src.start(t0); src.stop(t0 + len);
      } else {
        const o = ac.createOscillator(); o.type = 'sine';
        o.frequency.setValueAtTime(120, t0); o.frequency.exponentialRampToValueAtTime(40, t0 + 0.5);
        g.gain.setValueAtTime(0.6, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
        o.connect(g); o.start(t0); o.stop(t0 + 0.6);
      }
    } catch (e) {}
  }
  // 切り替わる瞬間に、次の曲名をキーボードで打つように1文字ずつ出す
  let typeTimer = null, fadeTimer = null;
  function flash() {
    const nx = djQueued != null && items[djQueued] ? items[djQueued].t || '' : '';
    const chars = Array.from('♪ ' + nx);
    clearInterval(typeTimer); clearTimeout(fadeTimer);
    mixEl.classList.remove('go', 'out'); mixEl.classList.add('type');
    mixEl.innerHTML = '<span class="typed"></span><span class="caret">▍</span>';
    const typed = mixEl.firstChild;
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const step = Math.max(28, Math.min(80, 1400 / chars.length));
    let k = reduce ? chars.length : 0;
    const done = () => { fadeTimer = setTimeout(() => mixEl.classList.add('out'), 1100); };
    if (reduce) { typed.textContent = chars.join(''); return done(); }
    typeTimer = setInterval(() => {
      typed.textContent = chars.slice(0, ++k).join('');
      if (k >= chars.length) { clearInterval(typeTimer); done(); }
    }, step);
  }
  setInterval(() => {
    if (attract || !dj || !playing || !player || current < 0) return;
    const dur = player.getDuration(), t = player.getCurrentTime();
    if (!(dur > 0)) return;
    if (djStart === null) {
      const target = dur > 100 ? Math.floor(dur * 0.3) : 0;
      if (Math.abs(t - target) > 2) player.seekTo(target, true);
      djStart = target; djPlayed.add(items[current].id);
      djQueued = djPick(); setNow();
      return;
    }
    // 入る位置に着いてから音を出す（ドンと一緒にふわっと上げる）
    if (djHush) {
      if (t < djStart - 0.5 || t > djStart + 5) { if (t < djStart - 0.5) return; }
      djHush = false;
      player.setVolume(0);
      try { player.unMute(); } catch (e) {}
      djFadeAt = Date.now(); sfx('boom');
      return;
    }
    const fin = (Date.now() - djFadeAt) / 2500;
    const end = Math.min(djStart + DJ_SECONDS, dur - 0.5), rest = end - t;
    let vol = Math.min(1, fin);
    if (rest < DJ_FADE) vol = Math.min(vol, Math.max(0, rest / DJ_FADE));
    player.setVolume(Math.round(vol * 100));
    if (rest <= 1.3 && !djWhoosh) { djWhoosh = true; sfx('whoosh'); flash(); }
    if (rest <= 0) { const j = djQueued != null && items[djQueued] && !items[djQueued].hide ? djQueued : djPick(); if (j != null) playAt(j); }
  }, 200);

  setInterval(() => {
    if (attract || !quick || !playing || !player || current < 0) return;
    const t = player.getCurrentTime();
    if (quickStart === null || t < quickStart) quickStart = t;
    const left = Math.max(0, Math.ceil(QUICK_SECONDS - (t - quickStart)));
    quickBtn.textContent = 'あと' + left + '秒';
    if (t - quickStart >= QUICK_SECONDS) { quickStart = null; step(1); }
  }, 300);
  document.querySelector('.tabs').addEventListener('click', e => {
    const b = e.target.closest('[data-f]'); if (!b) return;
    filter = b.dataset.f;
    if (filter === 'sub' && player && playing) player.pauseVideo();
    document.querySelectorAll('.tabs [data-f]').forEach(x => x.setAttribute('aria-selected', x === b));
    render();
  });

  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.body.appendChild(s);
}
</script>
</body>
</html>
