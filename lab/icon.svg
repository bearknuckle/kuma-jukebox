<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2540"/>
      <stop offset="1" stop-color="#14121c"/>
    </linearGradient>
    <linearGradient id="liq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="0.55" stop-color="#a06bff"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <clipPath id="flask">
      <path d="M206 112 H306 V196 L398 372 Q414 408 376 414 H136 Q98 408 114 372 L206 196 Z"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- liquid -->
  <g clip-path="url(#flask)">
    <path d="M60 282 Q128 252 196 282 T332 282 T468 282 V460 H60 Z" fill="url(#liq)"/>
  </g>
  <!-- flask outline -->
  <path d="M206 112 H306 V196 L398 372 Q414 408 376 414 H136 Q98 408 114 372 L206 196 Z"
        fill="none" stroke="#f2eff8" stroke-width="22" stroke-linejoin="round"/>
  <rect x="186" y="92" width="140" height="26" rx="13" fill="#f2eff8"/>
  <!-- music note -->
  <g fill="#fff">
    <ellipse cx="196" cy="366" rx="24" ry="18" transform="rotate(-20 196 366)"/>
    <rect x="212" y="296" width="10" height="70" rx="4"/>
    <path d="M216 296 Q246 304 250 332 Q236 316 216 316 Z"/>
  </g>
  <!-- rising chart -->
  <polyline points="272,376 302,346 324,360 356,318" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M338 312 L366 306 L360 334 Z" fill="#fff"/>
  <!-- bubbles -->
  <circle cx="290" cy="64" r="14" fill="#4f8cff"/>
  <circle cx="326" cy="38" r="9" fill="#ff8a3d"/>
  <circle cx="232" cy="52" r="8" fill="#a06bff"/>
</svg>
