<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>試作ゲームラボ</title>
<meta name="description" content="ブラウザですぐ遊べる試作ゲームの置き場">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#14121c;--panel:#1f1c2b;--line:#2f2b40;--text:#f2eff8;--dim:#9a94ad;--accent:#4f8cff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"M PLUS Rounded 1c",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 16px 48px}
header{margin-bottom:24px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.04em}
h1 span{color:var(--accent)}
.lead{color:var(--dim);font-size:14px;margin:8px 0 0;line-height:1.7}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0 16px}
.filters button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.filters button.on{background:var(--accent);border-color:var(--accent);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.game{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
a.game:hover{transform:translateY(-2px);border-color:var(--accent)}
.icon{flex:none;width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px}
.body{flex:1;min-width:0}
.name{font-size:17px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:10px;padding:2px 7px;border-radius:99px;background:#ff8a3d;color:#fff;font-weight:800}
.desc{font-size:13px;color:#d9d4e6;line-height:1.6;margin:4px 0 8px}
.meta{display:flex;gap:10px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.game.soon{opacity:.45;border-style:dashed}
footer{margin-top:32px;font-size:12px;color:var(--dim);text-align:center}
</style>
</head>
<body>
<main>
  <header>
    <h1><span>▶</span> 試作ゲームラボ</h1>
    <p class="lead">ブラウザですぐ遊べる試作ゲームの置き場です。スマホでもそのまま遊べます。感想があればぜひ教えてください。</p>
  </header>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <footer>ゲームは随時追加予定</footer>
</main>
<script>
// ゲームを増やすときはここに1件追加する
const GAMES=[
  {
    id:'shinko-shiritori', name:'進行しりとり', icon:'🎹', color:'#2f8f5f',
    desc:'場のコードに「自然につながる」コードをつないでいく、しりとり型カードゲーム。はったりとダウトあり。遊びながらコード進行の流れが身につく。',
    players:'1人（CPU 1〜3人）', time:'5〜10分', genre:'学べる', added:'2026-11-18', isNew:true
  },
  {
    id:'onechord', name:'ワンコード', icon:'🎵', color:'#4f8cff',
    desc:'コード進行のルールに沿ってカードを出し合う。出すたびにコードが鳴る、音楽系カードゲーム。',
    players:'1人（CPU 1〜3人）', time:'5分', genre:'音楽', added:'2026-11-18', isNew:true
  },
  {
    id:'uwasa-kabu', name:'ウワサ株', icon:'📈', color:'#d1453b',
    desc:'ニュースのウワサを見て株を売り買い。裏返して答え合わせ。遊びながら株取引のキホンが身につく。',
    players:'1人（CPU 3人）', time:'5〜10分', genre:'学べる', added:'2026-11-18', isNew:true
  },
];
const SOON={name:'次の試作を準備中…',icon:'🛠️',color:'#2a2639',desc:'新しいゲームができたらここに追加されます。'};

const genres=['すべて',...new Set(GAMES.map(g=>g.genre))];
let cur='すべて';
function render(){
  const f=document.getElementById('filters');f.innerHTML='';
  if(genres.length>2)genres.forEach(g=>{
    const b=document.createElement('button');b.textContent=g;if(g===cur)b.className='on';
    b.onclick=()=>{cur=g;render();};f.appendChild(b);
  });
  const grid=document.getElementById('grid');grid.innerHTML='';
  GAMES.filter(g=>cur==='すべて'||g.genre===cur)
    .sort((a,b)=>b.added.localeCompare(a.added))
    .forEach(g=>{
      const a=document.createElement('a');a.className='game';a.href=g.id+'/';
      a.innerHTML=`<div class="icon" style="background:${g.color}">${g.icon}</div>
        <div class="body"><div class="name">${g.name}${g.isNew?'<span class="tag">NEW</span>':''}</div>
        <div class="desc">${g.desc}</div>
        <div class="meta"><span>👥 ${g.players}</span><span>⏱ ${g.time}</span><span>🏷 ${g.genre}</span></div></div>`;
      grid.appendChild(a);
    });
  const s=document.createElement('div');s.className='game soon';
  s.innerHTML=`<div class="icon" style="background:${SOON.color}">${SOON.icon}</div><div class="body"><div class="name">${SOON.name}</div><div class="desc">${SOON.desc}</div></div>`;
  grid.appendChild(s);
}
render();
</script>
</body>
</html>
