<style>
:root{--bg:#14121c;--panel:#1f1c2b;--line:#2f2b40;--text:#f2eff8;--dim:#9a94ad;--accent:#4f8cff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"M PLUS Rounded 1c",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 16px 48px}
header{margin-bottom:24px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.04em}
h1{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:10px}
.lead{color:var(--dim);font-size:14px;margin:8px 0 0;line-height:1.7}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0 16px}
.filters button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.filters button.on{background:var(--accent);border-color:var(--accent);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.game{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
a.game:hover{transform:translateY(-2px);border-color:var(--accent)}
.icon{flex:none;width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px}
.body{flex:1;min-width:0}
.name{font-size:17px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:10px;padding:2px 7px;border-radius:99px;background:#ff8a3d;color:#fff;font-weight:800}
.desc{font-size:13px;color:#d9d4e6;line-height:1.6;margin:4px 0 8px}
.meta{display:flex;gap:10px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.game.soon{opacity:.45;border-style:dashed}
h2.cat{font-size:16px;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h2.cat:first-child{margin-top:4px}
.upd{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px}
.updrow{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:10px;color:inherit;text-decoration:none;font-size:13px;line-height:1.5}
.updrow:hover{background:#2a2639}
.ud{color:var(--dim);font-size:12px;min-width:38px;padding-top:1px}
.ui{font-size:16px}
.ut{flex:1;color:#d9d4e6}
.ut b{color:var(--text)}
.uv{font-size:11px;color:var(--dim)}
.more{background:none;border:none;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;padding:8px 4px}
.meta.hot{margin-top:4px;color:#ffae73}
.meta.played{margin-top:4px;color:#7fb2ff}
#reset{background:none;border:none;color:var(--dim);text-decoration:underline;font:inherit;font-size:12px;cursor:pointer;margin-top:6px}
.catnote{font-size:12px;color:var(--dim);margin:-4px 0 10px;line-height:1.6}
footer{margin-top:32px;font-size:12px;color:var(--dim);text-align:center}
</style>
</head>

let showAllUpdates=false;
function md(d){const [,m,dd]=d.split('-');return (+m)+'/'+(+dd);}
function renderUpdates(){
  const box=document.getElementById('updates');if(!box)return;
  const list=showAllUpdates?UPDATES:UPDATES.slice(0,3);
  box.innerHTML='<h2 class="cat">📝 最近の更新</h2>';
  const ul=document.createElement('div');ul.className='upd';
  list.forEach(u=>{const g=GAMES.find(x=>x.id===u.id);if(!g)return;
    const a=document.createElement('a');a.href=g.url||(g.id+'/');a.className='updrow';
    a.addEventListener('click',()=>recordPlay(g.id));
    a.innerHTML=`<span class="ud">${md(u.date)}</span><span class="ui">${g.icon}</span><span class="ut"><b>${g.name}</b> <span class="uv">v${u.version}</span><br>${u.text}</span>`;
    ul.appendChild(a);});
  box.appendChild(ul);
  if(UPDATES.length>3){const b=document.createElement('button');b.className='more';b.textContent=showAllUpdates?'閉じる':'もっと見る（全'+UPDATES.length+'件）';
    b.onclick=()=>{showAllUpdates=!showAllUpdates;renderUpdates();};box.appendChild(b);}
}

  try{
    const ctl=new AbortController();setTimeout(()=>ctl.abort(),90000);
    const r=await fetch(API,{signal:ctl.signal});const d=await r.json();
    if(d&&d.plays){GLOBAL=d.plays;render();}
  }catch(e){}
}
function recordPlay(id){sendPlay(id);const p=loadPlays();const r=p[id]||{n:0,last:0};r.n++;r.last=Date.now();p[id]=r;savePlays(p);PLAYS=p;}
function ago(t){const m=Math.floor((Date.now()-t)/60000);if(m<1)return'たった今';if(m<60)return m+'分前';const h=Math.floor(m/60);if(h<24)return h+'時間前';return Math.floor(h/24)+'日前';}
function byPop(a,b){
  const ga=GLOBAL[a.id]||0,gb=GLOBAL[b.id]||0;
  if(ga!==gb)return gb-ga;
  return byPlay(a,b);
}
function byPlay(a,b){
  const pa=PLAYS[a.id],pb=PLAYS[b.id];
  if(pa&&pb)return pb.last-pa.last;
  if(pa)return -1;if(pb)return 1;
  return b.added.localeCompare(a.added);
}
function card(g){
  const a=document.createElement('a');a.className='game';a.href=g.url||(g.id+'/');
  a.addEventListener('click',()=>recordPlay(g.id));
  const pl=PLAYS[g.id];
  a.innerHTML=`<div class="icon" style="background:${g.color}">${g.icon}</div>
    <div class="body"><div class="name">${g.name}${g.badge?`<span class="tag" style="background:#3a3550">${g.badge}</span>`:''}${g.isNew&&!pl?'<span class="tag">NEW</span>':''}</div>
    <div class="desc">${g.desc}</div>
    <div class="meta"><span>👥 ${g.players}</span><span>⏱ ${g.time}</span>${g.version?`<span>🧪 v${g.version}・${md(g.updated)}更新</span>`:''}</div>${GLOBAL[g.id]?`<div class="meta hot">🔥 みんなで ${GLOBAL[g.id]}回</div>`:''}${pl?`<div class="meta played">🕘 ${ago(pl.last)}に遊んだ · ${pl.n}回</div>`:''}${g.note?`<div class="meta" style="margin-top:4px">ℹ️ ${g.note}</div>`:''}</div>`;
  return a;
}
function render(){
  const cats=CATS.filter(c=>GAMES.some(g=>g.genre===c.id));
  const f=document.getElementById('filters');f.innerHTML='';
  [{id:'すべて',label:'すべて',icon:''},...cats].forEach(c=>{
    const b=document.createElement('button');
    const n=c.id==='すべて'?GAMES.length:GAMES.filter(g=>g.genre===c.id).length;
    b.textContent=(c.icon?c.icon+' ':'')+(c.id==='すべて'?'すべて':c.id)+' '+n;
    if(c.id===cur)b.className='on';
    b.onclick=()=>{cur=c.id;render();};f.appendChild(b);
  });
  const root=document.getElementById('grid');root.innerHTML='';root.className='';
  const hot=GAMES.filter(g=>GLOBAL[g.id]).sort(byPop).slice(0,3);
  if(cur==='すべて'&&hot.length){
    const h=document.createElement('h2');h.className='cat';h.textContent='🔥 最近の人気';root.appendChild(h);
    const n=document.createElement('p');n.className='catnote';n.textContent='みんなが遊んだ回数の多い順（回数はときどきリセットされます）';root.appendChild(n);
    const grid=document.createElement('div');grid.className='grid';
    hot.forEach(g=>grid.appendChild(card(g)));root.appendChild(grid);
  }
  const recent=GAMES.filter(g=>PLAYS[g.id]).sort(byPlay).slice(0,3);
  if(cur==='すべて'&&recent.length){
    const h=document.createElement('h2');h.className='cat';h.textContent='🕘 最近遊んだゲーム';root.appendChild(h);
    const grid=document.createElement('div');grid.className='grid';
    recent.forEach(g=>grid.appendChild(card(g)));root.appendChild(grid);
  }
  cats.filter(c=>cur==='すべて'||c.id===cur).forEach(c=>{
    const h=document.createElement('h2');h.className='cat';h.textContent=c.icon+' '+c.label;root.appendChild(h);
    if(c.note){const n=document.createElement('p');n.className='catnote';n.textContent=c.note;root.appendChild(n);}
    const grid=document.createElement('div');grid.className='grid';
    GAMES.filter(g=>g.genre===c.id).sort(byPop).forEach(g=>grid.appendChild(card(g)));
    root.appendChild(grid);
  });
  if(cur==='すべて'){
    const grid=document.createElement('div');grid.className='grid';grid.style.marginTop='24px';
    const s=document.createElement('div');s.className='game soon';
    s.innerHTML=`<div class="icon" style="background:${SOON.color}">${SOON.icon}</div><div class="body"><div class="name">${SOON.name}</div><div class="desc">${SOON.desc}</div></div>`;
    grid.appendChild(s);root.appendChild(grid);
  }
}
document.getElementById('reset').onclick=()=>{savePlays({});PLAYS={};render();};
window.addEventListener('pageshow',()=>{PLAYS=loadPlays();render();});
render();
renderUpdates();
loadGlobal();
</script>
</body>
