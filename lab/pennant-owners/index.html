<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ペナント・オーナーズ</title>
<!-- 試作ゲームラボ: 下のOGタグ・アイコン・「試作ゲームラボに戻る」リンクは消さないこと（作業ルールはリポジトリ直下の CLAUDE.md） -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="試作ゲームラボ">
<meta property="og:title" content="ペナント・オーナーズ｜試作ゲームラボ">
<meta property="og:description" content="選手を買って、打者3人と投手1人で勝負する、10分で遊べる野球カードゲーム。カードに書いてあるのは能力と値段だけ。サイコロ＋打力で打ち、勝てば賞金。エースは連投すると疲れる。">
<meta property="og:url" content="https://game-lab-oj9t.onrender.com/pennant-owners/">
<meta property="og:image" content="https://game-lab-oj9t.onrender.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--field:#1d5a37;--field2:#164a2c;--chalk:#f6f1e3;--paper:#fffaf0;--ink:#1e2420;--mute:#6b6f68;--gold:#f0bd3f;--red:#d0473f;--blue:#3466c9;--line:#e3dcc8}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Zen Kaku Gothic New",system-ui,sans-serif;color:var(--ink);background:repeating-linear-gradient(90deg,var(--field) 0 48px,var(--field2) 48px 96px);min-height:100vh}
#app{max-width:640px;margin:0 auto;padding:14px 12px 50px}
h1,h2,h3{margin:0}
.panel{background:var(--paper);border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.title{color:var(--chalk);text-align:center;padding:26px 8px 6px}
.title h1{font-size:34px;font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.title .sub{font-size:13px;opacity:.85;margin-top:6px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--gold);color:var(--ink);font-weight:700}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;background:var(--red);color:#fff;box-shadow:0 3px 0 #8c2b25}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8c2b25}
.btn.sub{background:#e9e2cf;color:var(--ink);box-shadow:0 3px 0 #bdb49c}
.btn.small{padding:6px 10px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.wide{width:100%}
.top{color:var(--chalk);display:flex;justify-content:space-between;align-items:center}
.round{font-family:"DotGothic16",monospace;font-size:20px}
.money{font-weight:700}
.sec{font-size:15px;font-weight:900}
.mute{color:var(--mute);font-size:13px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:5px 4px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--mute)}
td.l,th.l{text-align:left}
tr.me td{background:#fff1c9;font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:8px}
.card{position:relative;background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 6px 6px;text-align:center;font-size:12px;min-height:104px;display:flex;flex-direction:column}
.card.click{cursor:pointer}
.card.sel{border-color:var(--red);box-shadow:0 0 0 2px var(--red) inset}
.card.pit.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset}
.card.off{opacity:.45}
.card .kind{position:absolute;top:5px;left:5px;font-size:11px;font-weight:900;color:#fff;border-radius:5px;padding:1px 5px}
.card.bat .kind{background:var(--red)}
.card.pit .kind{background:var(--blue)}
.card .num{font-family:"DotGothic16",monospace;font-size:34px;line-height:1;margin-top:12px}
.card .nm{font-weight:700;font-size:13px;margin-top:4px}
.card .price{margin-top:auto;font-size:12px;font-weight:700;border-top:1px dashed var(--line);padding-top:4px}
.card .st{position:absolute;top:5px;right:5px;font-size:10px;font-weight:700;padding:1px 4px;border-radius:4px;background:#333;color:#fff}
.card .tired{color:var(--red);font-size:12px;font-family:"Zen Kaku Gothic New"}
.log{font-size:13px;line-height:1.7;margin:8px 0 0;padding-left:18px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;margin:8px 0}
.vs .sc{font-family:"DotGothic16",monospace;font-size:44px;line-height:1}
.vs .tn{font-size:13px;font-weight:700}
.result-big{text-align:center;font-size:26px;font-weight:900}
.atk{border-top:1px solid var(--line);padding:8px 0;font-size:13px}
.dice{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.die{display:inline-flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mute)}
.die b{width:30px;height:30px;border-radius:7px;background:#fff;border:1.5px solid #bbb;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink)}
.die.hit b{background:var(--gold);border-color:#b38512}
details summary{cursor:pointer;font-weight:700}
.rules{font-size:13px;line-height:1.75}
.rules ul{margin:6px 0;padding-left:18px}
.back{text-align:center;margin:18px 0 0;font-size:13px}.back a{color:var(--chalk)}
.hint{background:#f1ead6;border-radius:8px;padding:6px 9px;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===== ペナント・オーナーズ v0.2（シンプル版） =====
// アナログ版の内容物：選手カード（打者・投手）、6面サイコロ3個、お金トークン、疲労マーカー、勝敗表
const rnd=n=>Math.floor(Math.random()*n);
const d6=()=>1+rnd(6);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const $app=document.getElementById('app');

const ROUNDS=6, MARKET=4, START_MONEY=3, PRIZE_WIN=3, PRIZE_LOSE=1;
const PRICE={3:2,4:3,5:5};
// 市場デッキ：[種類, 能力, 枚数]
const DECK_SPEC=[['B',3,6],['B',4,6],['B',5,3],['P',3,4],['P',4,3],['P',5,2]];
const START=[['B',2],['B',2],['B',2],['P',2],['P',2]];
const SCHED=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
const NAMES=['浅倉','石動','宇佐美','江口','大槻','柏木','桐生','久住','小野寺','榊','篠原','白石','須藤','瀬川','高峰','千早','津田','遠野','長嶺','西園','野々村','橋爪','日向','藤堂','真柴','三雲','村瀬','望月','矢吹','結城','吉良','若林','相沢','綾瀬','伊吹','碓氷','皆川','葛城','黒崎','五十嵐','佐伯','志賀','菅原','芹沢','武藤','立花','月岡','鳴海','楢崎','南雲','服部','氷室','広瀬'];

let S=null, uid=0, pool=[];
const mk=(type,val)=>({id:++uid,name:pool.pop(),type,val,price:PRICE[val]||0,last:-9});
const bats=t=>t.roster.filter(p=>p.type==='B');
const pits=t=>t.roster.filter(p=>p.type==='P');
const tired=p=>p.type==='P'&&p.last===S.round-1;
const pv=p=>p?Math.max(0,p.val-(tired(p)?2:0)):0;   // 投手の今日の球威
const byId=(t,id)=>t.roster.find(p=>p.id===id);
const human=()=>S.teams[0];
const tname=t=>`<span class="dot" style="background:${t.color}"></span>${t.name}`;
const oppOf=id=>{const m=SCHED[(S.round-1)%3].find(m=>m.includes(id));return S.teams[m[0]===id?m[1]:m[0]];};

function newGame(){
  uid=0; pool=shuffle(NAMES.slice());
  const defs=[['ホームスターズ','#d0473f'],['湾岸ドルフィンズ','#2f7fd1'],['高原フォックス','#e08a1e'],['下町モグラーズ','#7a5bc4']];
  S={round:0,teams:defs.map(([name,color],i)=>({id:i,name,color,human:i===0,roster:START.map(s=>mk(...s)),money:START_MONEY,w:0,l:0,d:0,lineup:[],pitcher:null})),deck:[]};
  DECK_SPEC.forEach(([t,v,n])=>{for(let i=0;i<n;i++)S.deck.push(mk(t,v));});
  shuffle(S.deck);
  nextRound();
}

// ===== ① 補強 =====
function nextRound(){
  S.round++;
  if(S.round>ROUNDS){S.phase='end';render();return;}
  S.market=S.deck.splice(0,MARKET);
  const order=S.teams.slice().sort((a,b)=>a.w-b.w||a.money-b.money||rnd(3)-1);
  S.order=order.map(t=>t.id); S.idx=0; S.log=[];
  S.phase='draft';
  cpuUntilHuman(); render();
}
function cpuUntilHuman(){
  while(S.idx<S.order.length && !S.teams[S.order[S.idx]].human){cpuBuy(S.teams[S.order[S.idx]]);S.idx++;}
}
function buy(t,c){
  S.market.splice(S.market.indexOf(c),1); t.money-=c.price; t.roster.push(c);
  S.log.push(`${t.human?'あなた':t.name}：${c.name}（${c.type==='B'?'打':'投'}${c.val}）を${c.price}億で獲得`);
}
function cpuBuy(t){
  const b=bats(t).map(p=>p.val).sort((x,y)=>y-x), p=pits(t).map(p=>p.val).sort((x,y)=>y-x);
  let best=null,bv=0;
  S.market.forEach(c=>{
    if(c.price>t.money) return;
    const gain=c.val-(c.type==='B'?b[2]:p[1]) - c.price*0.15;
    if(gain>bv){bv=gain;best=c;}
  });
  if(best) buy(t,best); else S.log.push(`${t.name}：パス`);
}
function humanBuy(id){const c=S.market.find(x=>x.id===id),t=human();if(!c||c.price>t.money)return;buy(t,c);S.idx++;cpuUntilHuman();render();}
function humanPass(){S.log.push('あなた：パス');S.idx++;cpuUntilHuman();render();}

// ===== ② 編成 =====
function autoLineup(t){
  t.lineup=bats(t).sort((a,b)=>b.val-a.val).slice(0,3).map(p=>p.id);
  const ps=pits(t).sort((a,b)=>pv(b)-pv(a)||a.val-b.val);
  t.pitcher=ps.length?ps[0].id:null;
}
function goLineup(){S.teams.forEach(autoLineup);S.phase='lineup';render();}
function toggleBat(id){const t=human(),i=t.lineup.indexOf(id);if(i>=0)t.lineup.splice(i,1);else if(t.lineup.length<3)t.lineup.push(id);render();}
function setPitcher(id){human().pitcher=id;render();}

// ===== ③ 試合 =====
function attack(X,Y){
  const need=pv(byId(Y,Y.pitcher))+4;
  const dice=X.lineup.map(id=>{const p=byId(X,id),d=d6();return {name:p.name,val:p.val,d,hit:d+p.val>=need};});
  return {need,dice,runs:dice.filter(x=>x.hit).length};
}
function playGame(A,B){
  const g={a:A.id,b:B.id,rounds:[]};
  for(let k=0;k<2;k++){            // 同点なら1回だけ延長
    const r={x:attack(A,B),y:attack(B,A)}; g.rounds.push(r);
    if(r.x.runs!==r.y.runs) break;
  }
  const last=g.rounds[g.rounds.length-1];
  g.ra=g.rounds.reduce((s,r)=>s+r.x.runs,0); g.rb=g.rounds.reduce((s,r)=>s+r.y.runs,0);
  g.win=last.x.runs>last.y.runs?A.id:last.y.runs>last.x.runs?B.id:null;
  [A,B].forEach(t=>{
    const res=g.win===null?'d':g.win===t.id?'w':'l'; t[res]++;
    t.money+=res==='w'?PRIZE_WIN:PRIZE_LOSE+(res==='d'?1:0);
    const p=byId(t,t.pitcher); if(p) p.last=S.round;
  });
  return g;
}
function playBall(){
  if(human().lineup.length<Math.min(3,bats(human()).length)) return;
  S.games=SCHED[(S.round-1)%3].map(([i,j])=>playGame(S.teams[i],S.teams[j]));
  S.phase='game'; render();
}

// ===== 描画 =====
function card(p,o={}){
  const cls=['card',p.type==='B'?'bat':'pit',o.click?'click':'',o.sel?'sel':'',o.off?'off':''].join(' ');
  return `<div class="${cls}" ${o.click?`onclick="${o.click}"`:''}><span class="kind">${p.type==='B'?'打':'投'}</span>${tired(p)?'<span class="st">疲労</span>':''}
  <div class="num">${p.val}${tired(p)?`<span class="tired">→${pv(p)}</span>`:''}</div><div class="nm">${p.name}</div>
  ${o.price?`<div class="price">${p.price}億</div>`:''}${o.extra||''}</div>`;
}
function standings(){
  const ts=S.teams.slice().sort((a,b)=>b.w-a.w||b.d-a.d||b.money-a.money);
  return `<table><tr><th class="l">チーム</th><th>勝</th><th>敗</th><th>分</th><th>お金</th></tr>${ts.map(t=>`<tr class="${t.human?'me':''}"><td class="l">${tname(t)}</td><td>${t.w}</td><td>${t.l}</td><td>${t.d}</td><td>${t.money}</td></tr>`).join('')}</table>`;
}
const BACK='<p class="back"><a href="../">← 試作ゲームラボに戻る</a> ・ ペナント・オーナーズ v0.2</p>';
function rules(open){
  return `<details class="panel" ${open?'open':''}><summary>ルール</summary><div class="rules">
  <p>4球団で${ROUNDS}ラウンド戦い、<b>勝った数が一番多い球団の優勝</b>（同じならお金が多い方）。1ラウンドは次の3つだけ。</p>
  <ul>
  <li><b>① 補強</b>：選手カードを${MARKET}枚並べ、勝ちが少ない球団から順に1枚買うかパス。値段は能力3が2億、4が3億、5が5億。</li>
  <li><b>② 編成</b>：打者3人と投手1人を出す。前のラウンドに投げた投手は疲労して球威−2。</li>
  <li><b>③ 試合</b>：打者1人がサイコロ1個。<b>出目＋打力 ≥ 相手の球威＋4</b>ならヒットで1点。点が多い方の勝ち（同点ならもう1回だけ振り、それでも同点なら引き分け）。賞金は勝ち${PRIZE_WIN}億、負け${PRIZE_LOSE}億、引き分け2億。</li>
  </ul>
  <p class="mute">アナログ版の内容物：選手カード24枚＋初期選手20枚、サイコロ3個、お金トークン、疲労マーカー、勝敗表。</p>
  </div></details>`;
}

function render(){
  if(!S){
    $app.innerHTML=`<div class="title"><span class="badge">AIと考えた試作ゲーム</span><h1 style="margin-top:12px">ペナント・オーナーズ</h1><div class="sub">選手を買って、3人で打つ。10分の野球カードゲーム</div></div>
    <div class="panel"><button class="btn wide" onclick="newGame()">シーズン開幕</button></div>${rules(true)}${BACK}`;return;
  }
  const t=human();
  if(S.phase==='end'){
    const ts=S.teams.slice().sort((a,b)=>b.w-a.w||b.d-a.d||b.money-a.money), rank=ts.indexOf(t)+1;
    $app.innerHTML=`<div class="title"><span class="badge">シーズン終了</span><h1 style="margin-top:12px">${rank===1?'🏆 優勝！':rank+'位'}</h1></div>
    <div class="panel">${standings()}<div style="margin-top:12px"><button class="btn wide" onclick="newGame()">もう1シーズン</button></div></div>${BACK}`;
    window.scrollTo(0,0);return;
  }
  let h=`<div class="top"><span class="round">ROUND ${S.round}/${ROUNDS}</span><span class="money">💰 ${t.money}億</span></div>`;
  if(S.phase==='draft'){
    const mine=S.idx<S.order.length&&S.teams[S.order[S.idx]].human, done=S.idx>=S.order.length;
    h+=`<div class="panel"><div class="sec">① 補強：1人買うかパス</div>
    <div class="mute" style="margin-top:4px">順番：${S.order.map(i=>S.teams[i].human?'<b>あなた</b>':S.teams[i].name).join(' → ')}</div>
    <div class="cards">${S.market.map(c=>card(c,{price:true,off:mine&&c.price>t.money,extra:mine?`<button class="btn small" style="margin-top:5px" ${c.price>t.money?'disabled':''} onclick="humanBuy(${c.id})">買う</button>`:''})).join('')||'<span class="mute">売り切れ</span>'}</div>
    ${mine?`<div style="margin-top:10px"><button class="btn sub wide" onclick="humanPass()">パス</button></div>`:''}
    ${S.log.length?`<ul class="log">${S.log.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
    ${done?`<div style="margin-top:12px"><button class="btn wide" onclick="goLineup()">② 編成へ</button></div>`:''}</div>
    <div class="panel"><div class="sec">あなたの選手</div><div class="cards">${t.roster.map(p=>card(p)).join('')}</div></div>`;
  }
  else if(S.phase==='lineup'){
    const o=oppOf(0), op=byId(o,o.pitcher), need=Math.min(3,bats(t).length);
    h+=`<div class="panel"><div class="sec">② 編成：相手は ${tname(o)}</div>
    <div class="hint">相手の投手は球威${pv(op)}${op&&tired(op)?'（疲労中）':''} → <b>出目＋打力が${pv(op)+4}以上</b>でヒット</div>
    <div style="margin-top:10px"><b>打者を3人</b> <span class="mute">${t.lineup.length}/${need}</span></div>
    <div class="cards">${bats(t).map(p=>card(p,{click:`toggleBat(${p.id})`,sel:t.lineup.includes(p.id)})).join('')}</div>
    <div style="margin-top:10px"><b>投手を1人</b></div>
    <div class="cards">${pits(t).map(p=>card(p,{click:`setPitcher(${p.id})`,sel:t.pitcher===p.id})).join('')}</div>
    <div style="margin-top:12px"><button class="btn wide" ${t.lineup.length<need?'disabled':''} onclick="playBall()">③ プレイボール！</button></div></div>`;
  }
  else if(S.phase==='game'){
    const g=S.games.find(g=>g.a===0||g.b===0), other=S.games.find(x=>x!==g);
    const A=S.teams[g.a],B=S.teams[g.b];
    const res=g.win===null?'引き分け':g.win===0?'勝利！':'敗戦…';
    const side=(X,a)=>`<div class="atk"><b>${X.name}</b>（${a.need}以上でヒット）→ ${a.runs}点<div class="dice">${a.dice.map(x=>`<span class="die ${x.hit?'hit':''}"><b>${x.d}</b>${x.name}+${x.val}</span>`).join('')}</div></div>`;
    h+=`<div class="panel"><div class="result-big" style="color:${g.win===0?'var(--red)':'var(--ink)'}">${res}</div>
    <div class="vs"><div><div class="sc">${g.ra}</div><div class="tn">${A.name}</div></div><div>−</div><div><div class="sc">${g.rb}</div><div class="tn">${B.name}</div></div></div>
    ${g.rounds.map((r,i)=>`${i?'<div class="sec" style="margin-top:6px">延長</div>':''}${side(A,r.x)}${side(B,r.y)}`).join('')}
    <div class="atk">他会場：${S.teams[other.a].name} ${other.ra} − ${other.rb} ${S.teams[other.b].name}</div>
    <div class="mute">賞金：勝ち${PRIZE_WIN}億・引き分け2億・負け${PRIZE_LOSE}億</div>
    <div style="margin-top:12px"><button class="btn wide" onclick="nextRound()">${S.round>=ROUNDS?'最終結果へ':'次のラウンドへ'}</button></div></div>
    <div class="panel"><div class="sec">順位</div>${standings()}</div>`;
  }
  $app.innerHTML=h+rules(false)+BACK;
  window.scrollTo(0,0);
}
render();
</script>
</body>
</html>
